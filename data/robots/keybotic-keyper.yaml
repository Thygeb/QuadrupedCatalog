  autonominiveau:
    vaerdi: "Fuldt autonom navigation og 3D-kortlaegning uden GPS eller internet (\"can operate without a GPS even in unknown territories, as it maps constantly the environment in 3D to geolocalize itself\"); fortsaetter opgaven uden internetforbindelse, men kan ikke sende realtidsalarmer offline; reagerer paa aendringer i omgivelserne og traeffer selv beslutninger om rute og handling; kan koordinere opgaver med andre Keyper-robotter; kan ogsaa teleopereres via realtidsbilleder"
    kilde: https://keybotic.com/technology/
    hentet: 2026-08-24
    advarsel: "Sammensat af flere afsnit paa samme side: \"Decision Making and Task Planning\" (\"Reacts to environmental changes and decides on actions and best routes... Coordinates and distributes missions with other Keypers\") og FAQ (\"Yes, Keyper can operate without a GPS...\", \"Keyper will still operate without an internet connection, continuing its mission normally...\"). Ingen eksplicit navngivet autonominiveau-skala."
