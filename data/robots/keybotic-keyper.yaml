    advarsel: "\"Lidar model: 32 channels\" - producenten navngiver selv modellen som kanalantallet, intet separat maerke/modelnummer oplyst. Oevrige tal (\"Horizontal field of view: 360º\", \"Vertical field of view: 90º\", \"Range: 35m\", \"Precision: Up to 1cm\", \"Laser Product Class: Class 1 eye-safe per IEC/EN 60825-1: 2014\", \"Laser Wavelength: 865 nm\") staar alle i samme Specifications-afsnit."
  kameraer:
    vaerdi: "5 kameraer (front top+bund, venstre, hoejre, bagud), dybderaekkevidde 10 m, RGB-billede 640×320@15FPS, dybdebillede 640×320@15FPS, 86° horisontalt dybdesynsfelt. Separat \"Inspection Head\"-modul (4 kg): zoomkamera, termisk kamera, ultralydsmikrofon, projektoer, hoejttalere"
    kilde: https://keybotic.com/technology/
    hentet: 2026-08-24
    advarsel: "\"With 5 cameras -on the front (top and bottom), on the left, right, and back- Keyper has a depth range of 10m... RGB Image: 640×320 @ 15FPS, Depth Image: 640×320 @ 15FPS, Depth field of view: 86º horizontal\" plus separat afsnit \"Inspection Head - Weighting only 4kg... Zoom Camera, Thermal Camera, Ultrasonic Microphone, Spotlight, Speakers\"."
  compute:
