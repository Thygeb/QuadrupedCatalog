    hentet: 2026-08-24
    advarsel: "\"CPU Model: Intel 1260P, CPU Cores: 4P + 8E, CPU Threads: 16, Memory: 16GB RAM (up to 64GB), Storage: 1TB M2 drive\" under overskriften \"Computing\"."
