noter:
  - "EU-PRODUCENT - den eneste i hele indsamlingen. MAB Robotics Sp. z o.o., ul. Za Cytadela 108, Poznan. VAT PL7822870297."
  - "EU-KOLONNENS MODEKSEMPEL. Den eneste EU-producent i indsamlingen oplyser INTET om CE - og bredere: nul træf på CE, conformity, declaration, certif, EN ISO, RoHS, ATEX, UKCA og FCC i 1,48 MB HTML, negativt OG positivt kontrolleret. Ikke fordi maskinen ikke har CE (en polsk maskine solgt i EU skal have det), men fordi CE er så selvfølgeligt for en EU-producent, at ingen skriver det. CE oplyst = nej betyder derfor ikke det samme for en polsk og en amerikansk producent. Kolonnen må vise oplyst / ikke oplyst, aldrig har CE / har ikke CE."
  - "Afløser Honey Badger 4.0. Generationsskiftet går den forkerte vej på to felter: 5.0 er tungere (17 mod 12 kg) og har lavere tæthedsklasse (IP66 mod up to IP67) end 4.0."
