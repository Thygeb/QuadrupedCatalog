slug: microrobotech-movenew-p1
navn: MOVENEW P1
producent: MicroRoboTech
producentland: Kina
producentby: Hangzhou
status: i_produktion
anvendelse:
  vaerdi: [industri, inspektion, forsvar_beredskab, sikkerhed_overvaagning]
  citat: "All-terrain quadruped robot for industrial inspection, fire response, and public safety missions."
  kilde: https://www.micbotics.com/list_12/98.html
  hentet: 2026-08-24
  note: "\"industrial inspection\" -> industri + inspektion; \"fire response\" -> forsvar_beredskab; \"public safety missions\" -> sikkerhed_overvaagning."
noter:
  - "Tabellens raekkefoelge er forvirrende: \"Max Climbing Ability: 800 mm\" staar lige foer \"Step Negotiation: 45°\" og \"Slope Capability: >45°\" - dvs. to raekker med samme talvaerdi (45°) under to forskellige etiketter, og en meget stor 800 mm-vaerdi under en etikette (\"Climbing Ability\"), man normalt ville forvente var en vinkel. Ikke rettet stiltiende - se advarsler paa forhindring_enkelt og haeldning."
billede:
  fil: fotos/fabrikant/microrobotech-movenew-p1.jpg
  ophav: fabrikant
  kilde: https://www.micbotics.com/list_12/98.html
  hentet: 2026-08-24
felter:
  egenvaegt:
    vaerdi: 77
    enhed: kg
    kilde: https://www.micbotics.com/list_12/98.html
    hentet: 2026-08-24
    advarsel: "\"Total Weight: 77kg (Battery included)\" - eksplicit med batteri, i modsaetning til T1's tvetydige etikette."
  laengde:
    vaerdi: 900
    enhed: mm
    kilde: https://www.micbotics.com/list_12/98.html
    hentet: 2026-08-24
    advarsel: "\"Standing Dimensions: 900mm x 600mm x 650mm\" - akserne er ikke maerket. Braekkefoelgen laengde x bredde x hoejde er antaget, ikke bekraeftet."
  bredde:
    vaerdi: 600
    enhed: mm
    kilde: https://www.micbotics.com/list_12/98.html
    hentet: 2026-08-24
    advarsel: "USIKKER TILDELING - se laengde."
  hoejde:
    vaerdi: 650
    enhed: mm
    kilde: https://www.micbotics.com/list_12/98.html
    hentet: 2026-08-24
    advarsel: "USIKKER TILDELING - se laengde. Foldet maal 1150 x 800 x 200 mm; skemaet har intet foldefelt."
  frihedsgrader:
    vaerdi: 16
    enhed: DoF
    kilde: https://www.micbotics.com/list_12/98.html
    hentet: 2026-08-24
    advarsel: "\"High-Performance Motors: 16 units\" - motorantal, ikke eksplicit DoF. Samme fortolkning som T1 og Go2."
  nyttelast_gaaende:
    vaerdi: 200
    enhed: kg
    kilde: https://www.micbotics.com/list_12/98.html
    hentet: 2026-08-24
    advarsel: "Etiket \"Max Walking Load\"."
  nyttelast_staaende:
    vaerdi: 400
    enhed: kg
    kilde: https://www.micbotics.com/list_12/98.html
    hentet: 2026-08-24
    advarsel: "Etiket \"Max Standing Load\"."
  hastighed:
    vaerdi: 3
    enhed: m/s
    kilde: https://www.micbotics.com/list_12/98.html
    hentet: 2026-08-24
  haeldning:
    vaerdi: 45
    enhed: "°"
    operator: ">"
    kilde: https://www.micbotics.com/list_12/98.html
    hentet: 2026-08-24
    advarsel: "Etiket \"Slope Capability: >45°\". En anden raekke, \"Step Negotiation\", viser ogsaa 45° uden \">\" - muligvis samme oplysning gentaget under to etiketter, muligvis en skabelonfejl hos producenten. Kun \"Slope Capability\"-raekken er brugt her, fordi den har den klareste etikette og operator."
  forhindring_enkelt:
    vaerdi: 800
    enhed: mm
    kilde: https://www.micbotics.com/list_12/98.html
    hentet: 2026-08-24
    advarsel: "Etiket \"Max Climbing Ability: 800 mm\". Usaedvanligt stort tal for en enkelt forhindring (dobbelt saa hoejt som T1's 400mm-klasse forhindring) - ikke efterproevet mod et andet felt, og kunne vaere en skrivefejl hos producenten (fx forvekslet med rampe-/last-relateret maal). Gemt ordret, ikke rettet."
  trappetrin_kontinuerlig:
    vaerdi: 25
    enhed: cm
    kilde: https://www.micbotics.com/list_12/98.html
    hentet: 2026-08-24
    advarsel: "Etiket \"Stair Climbing Capability: Max step height 25cm\"."
  ip_klasse:
    vaerdi: IP67
    kilde: https://www.micbotics.com/list_12/98.html
    hentet: 2026-08-24
    advarsel: "Kilden tilfoejer \"(Wheel Protection Rating IP68)\" - hjulene har en anden, hoejere klasse end helmaskinen. Kun helmaskinens IP67 er brugt i feltet."
  temp_min:
    vaerdi: -40
    enhed: "°C"
    kilde: https://www.micbotics.com/list_12/98.html
    hentet: 2026-08-24
  temp_maks:
    vaerdi: 55
    enhed: "°C"
    kilde: https://www.micbotics.com/list_12/98.html
    hentet: 2026-08-24
  batteri_wh:
    vaerdi: 3200
    enhed: Wh
    kilde: https://www.micbotics.com/list_12/98.html
    hentet: 2026-08-24
    advarsel: "\"Hot-swappable 3.2kWh NMC battery (Supply voltage: 72V)\"."
  hot_swap:
    vaerdi: ja
    kilde: https://www.micbotics.com/list_12/98.html
    hentet: 2026-08-24
    advarsel: "Ordet \"Hot-swappable\" staar direkte i batteri-raekken."
  ladetid:
    vaerdi: 1.5
    enhed: t
    kilde: https://www.micbotics.com/list_12/98.html
    hentet: 2026-08-24
    advarsel: "Etiket \"Charging Time: 1.5h\"."
  driftstid:
    vaerdi_min: 8
    vaerdi_maks: 12
    enhed: t
    ved_last: ikke_oplyst
    kilde: https://www.micbotics.com/list_12/98.html
    hentet: 2026-08-24
    advarsel: "\"No-load continuous operating time: <=12h\" og \"Full-load continuous operating time: <=8h\". To lastbetingelser (ingen last / fuld last) uden et konkret kg-tal for \"fuld last\" - kan derfor ikke skrives som et masse-kort i ved_last, kun som tilstanden ikke_oplyst. \"Max Walking Load: 200kg\" staar i tabellen, men producenten forbinder den IKKE eksplicit til \"fuld last\"-raekken, saa forbindelsen er ikke lavet her."
  dockingstation: ikke_oplyst
  lidar:
    vaerdi: "96-line automotive-grade LiDAR (understoetter op til 3 enheder)"
    kilde: https://www.micbotics.com/list_12/98.html
    hentet: 2026-08-24
    advarsel: "Etiket \"Automotive-grade LiDAR: 96-line LiDAR 1 (supports installation of up to 3 units)\". Linjetal oplyst - taeller derfor med under D4 (type MED model/specifikation), i modsaetning til T1's."
  kameraer:
    vaerdi: "HD Depth Camera (support for installation), Ultrasonic Radar (support for installation)"
    kilde: https://www.micbotics.com/list_12/98.html
    hentet: 2026-08-24
    advarsel: "Begge raekker siger \"Support for installation\", IKKE at udstyret er standard monteret. Gemt som producentens egen formulering, ikke omsat til \"ja, kamera monteret\"."
  compute:
    vaerdi: "Understoetter op til 2000 TOPS"
    kilde: https://www.micbotics.com/list_12/98.html
    hentet: 2026-08-24
    advarsel: "Raa tekst: \"Supports 2000 tops\". Ordet \"Supports\" antyder maksimal understoettet regnekraft ved tilvalgt modul, ikke noedvendigvis indbygget som standard - modsat T1, hvor \"Jetson Orin NX Super+RK3588\" er navngivet som det faktiske kernemodul."
  ros2: ikke_oplyst
  sdk_sprog: ikke_oplyst
  autonominiveau:
    vaerdi: "Multi-sensor fusion perception system + high-computing power platform, der danner et 360° omnidirektionelt situationsbevidsthedsnetvaerk, som daekker miljoepercepetion, overvaagning og vidensresonnering (\"knowledge reasoning\")."
    kilde: https://www.micbotics.com/public/upload/file/20260416/1776307542577931.pdf
    hentet: 2026-08-25
    kildetype: sekundaer
    advarsel: "PDF-datablad (\"MOVENEW P1 - Industrial Special-Purpose Wheeled Quadruped Robot\"), side 3 (\"Integrated Sensing & Control\"): \"Equipped with a multi-sensor fusion perception system and a high-computing power platform, it forms a 360° omnidirectional environmental awareness network, fully covering functional modules such as environmental perception, monitoring, and knowledge reasoning.\" Kvalitativ beskrivelse - intet numerisk autonominiveau (SAE/ISO-lignende skala) oplyst."
  monteringsinterface:
    vaerdi: "\"Expansion Rails\" markeret som standardfunktion i databladets funktionstabel (side 4, \"Function Configuration\"). Ingen standardiseret monteringsflade-navn, -maal eller hurtigskift-mekanisme oplyst."
    kilde: https://www.micbotics.com/public/upload/file/20260416/1776307542577931.pdf
    hentet: 2026-08-25
    kildetype: sekundaer
    advarsel: "PDF-datablad, side 4 (\"P1 Technical Specifications\"), afsnit \"Function Configuration\": raekken \"Expansion Rails\" er markeret med en prik (til stede), samme moenster som T1's \"Top Mount Expansion\"/\"Undercarriage Expansion\" - men uden yderligere specifikation af interface-standard eller belastningsevne."
  stroem_ud: ikke_oplyst
  dataporte:
    vaerdi: ["HDMI x1 (Audio-Radar-Vision Port)", "USB x1 (Audio-Radar-Vision Port)", "RS485 x1 (Radar Port)", "USB x3 (Radar Port)", "HDMI x1 (Camera Port)"]
    kilde: https://www.micbotics.com/list_12/98.html
    hentet: 2026-08-24
  pris: ikke_oplyst
  ce_oplyst: ikke_oplyst
