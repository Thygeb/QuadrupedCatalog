    kilde: "https://support.magiclab.top/docs/dog/about"
    hentet: "2026-08-19"
    advarsel: "The manufacturer’s own developer documentation for MagicDog HAS ROS2 (ROS2 API, ROS2 SDK guide, ros2_reference), and EDU is the variant with SDK access. The field is nonetheless left blank because D1 — whether the manufacturer’s developer documentation counts as a source — is open. If D1 is resolved, the field is filled in. The documentation is also Chinese-only, so a reader cannot read the source."
    advarsel_ordlyd: "\"ROS2 API\""
  sdk_sprog:
    vaerdi: "ikke_oplyst"
    kilde: "https://www.magiclab.top/en/dog"
    hentet: "2026-08-19"
    advarsel: "SDK Support is marked with a filled circle = YES on EDU and an open circle = no on PRO. That is the only specification difference between the two models, and the sign is counterintuitive: it is EDU that has the SDK. The field asks about the LANGUAGES, which the product page does not mention — hence not stated here, against PRO’s documented no. The developer documentation (D1 open) states C++ and Python."
    advarsel_ordlyd: "\"SDK Support[2]\" \"●\""
