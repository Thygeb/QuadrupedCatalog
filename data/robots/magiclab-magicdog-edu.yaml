noter:
  - "HOME CITY IS SUZHOU, NOT WUJIANG: the manufacturer’s global site states directly \"Founded in 2024 and headquartered in Suzhou\" and repeats \"Founded in Suzhou, China\". The string \"Wujiang\", which the record previously carried alongside Suzhou, appears 0 times across the company’s archived pages."
  - "TWO MANUFACTURER SITES THAT CONTRADICT EACH OTHER. magiclab.top and the new magiclabglobal.com are both live, both the manufacturer’s own, and they disagree on weight, obstacle height, degrees of freedom, runtime and speed. The source used here is magiclab.top; the global site’s diverging figures are recorded in the caveats. Which site counts as the primary source is not the collector’s call."
  - "EDU and PRO share 41 of 43 table rows. The only specification difference is SDK access: EDU has SDK access, PRO does not. Measured cell by cell: 43 data lines, 41 identical, 2 different (the name row and the SDK row)."
