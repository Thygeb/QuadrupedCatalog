  hentet: "2026-08-24"
  note: "Own translation: \"Gangben L1 is GENISOM AI’s own first industrial-grade small quadruped robot ... widely used in power-grid inspection, emergency rescue, security patrol, research and education.\" 电力巡检 (power-grid inspection) -> inspection; 应急救援 (emergency rescue) -> defense and emergency response; 安防巡逻 (security patrol) -> security and surveillance; 科研教育 (research and education) -> research and development (the education part of 科研教育 has no precise match in the value set beyond consumer and education, which is not used here, since the context is professional research, not a consumer product)."
  note_ordlyd: "Own translation: \"Gangben L1 is GENISOM AI’s own first industrial-grade small quadruped robot ... widely used in power-grid inspection, emergency rescue, security patrol, research and education.\" 电力巡检 (power-grid inspection) -> inspection; 应急救援 (emergency rescue) -> defense and emergency response; 安防巡逻 (security patrol) -> security and surveillance; 科研教育 (research and education) -> research and development (the education part of 科研教育 has no precise match in the value set beyond consumer and education, which is not used here, since the context is professional research, not a consumer product)."
