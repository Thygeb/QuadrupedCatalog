  note: "Egen oversættelse: \"Gangben L1 er GENISOM AI's selvudviklede første industriklasse små firbenede robot... anvendes bredt inden for elkraftinspektion, redningsberedskab, sikkerhedspatrulje, forskning og uddannelse.\" 电力巡检 -> inspektion; 应急救援 -> forsvar og beredskab; 安防巡逻 -> sikkerhed og overvågning; 科研教育 -> forskning og udvikling (uddannelsesdelen af 科研教育 har intet præcist svar i værdisættet ud over forbruger og uddannelse, som ikke er brugt her, da konteksten er faglig forskning, ikke forbrugerprodukt)."
