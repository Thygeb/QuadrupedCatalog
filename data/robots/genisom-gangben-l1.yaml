slug: genisom-gangben-l1
navn: Gangben L1
producent: GENISOM AI
producentland: Kina
producentby: Beijing / Suzhou
status: i_produktion
anvendelse:
  vaerdi: [inspektion, forsvar_beredskab, sikkerhed_overvaagning, forskning_udvikling]
  citat: "钢镚L1是智身科技自主研发的首款行业级小型四足机器人...广泛应用于电力巡检、应急救援、安防巡逻、科研教育等场景。"
  kilde: https://www.genisomai.com/product-robot/L1
  hentet: 2026-08-24
  note: "Egen oversaettelse: \"Gangben L1 er GENISOM AI's selvudviklede foerste industriklasse smaa firbenede robot... anvendes bredt inden for elkraftinspektion, redningsberedskab, sikkerhedspatrulje, forskning og uddannelse.\" 电力巡检 -> inspektion; 应急救援 -> forsvar_beredskab; 安防巡逻 -> sikkerhed_overvaagning; 科研教育 -> forskning_udvikling (uddannelsesdelen af 科研教育 har intet praecist svar i vaerdisaettet ud over forbruger_uddannelse, som ikke er brugt her, da konteksten er faglig forskning, ikke forbrugerprodukt)."
noter:
  - "STOPPROEVE (firbenet): bestaaet, entydigt. Meta-keywords paa producentens egen produktside: \"具身智能,四足机器人,机器狗,行业级机器人,钢镚L1,...\" (fire ben; 四足机器人 = quadruped robot, 机器狗 = robot dog). Meta-description: \"钢镚L1是智身科技自主研发的首款行业级小型四足机器人\" (Gangben L1 er GENISOM AI's selvudviklede foerste industriklasse smaa firbenede robot). https://www.genisomai.com/product-robot/L1, hentet 2026-08-24. L1 er en ren gaaende (\"点足\", punktfod) model, ikke en hjul-ben-hybrid."
  - "PRODUKTIONSTAL 15.000+ ENHEDER: EFTERPROEVET SOM PRODUCENTENS EGET, IKKE KUN PRESSENS. Homepage genisomai.com viser billedtekst \"累计量产突破 15,000 台\" (kumuleret produktion har passeret 15.000 enheder) direkte i en heltalsgrafik paa forsiden. Selskabets egen om-os-side gentager det i en tidslinje: \"2026年6月底，完成了第15000台行业级具身智能机器人的量产\" (ved udgangen af juni 2026 blev produktion af den 15.000. industriklasse embodied-AI-robot fuldfoert). Begge citater er hentet direkte fra genisomai.com (hhv. forsiden og /aboutus.html, hentet 2026-08-24), ikke fra pressemateriale. Tidligere kilde for tallet var pressen (Sohu) - denne runde bekraefter, at producenten selv trykker det samme tal paa egen hjemmeside. Tallet DAEKKER HELE GENISOM-KATALOGET (Gangben L1/L1-W/L2 + Tongchui M1), ikke L1 alene - producenten opdeler ikke tallet pr. model."
  - "GANGBEN-SERIEN ER STOERRE END DE TO POSTER I DENNE OMGANG. Fundet paa genisomai.com, men IKKE bygget som selvstaendige poster: 钢镚 L1-W (hjul-ben-variant af L1), 钢镚 L1 Maker (undervisningsudgave af L1), 钢镚 L2-W og 钢镚 L2-W Ultra (hjul-ben-varianter af L2, dokumenteret i L2's egen tekniske JSON-tabel). Desuden fandtes to selvstaendige produktlinjer hos samme producent, der IKKE hedder \"钢镚\"/Gangben: 铜锤 M1 (Tongchui M1, mellemklasse firbenet robot, egen produktside genisomai.com/product-robot/M1) og 铅球 SP1 (Qiuqiu SP1, eksplosionssikker hjul-ben firbenet robot). Alle er bekraeftet firbenede efter producentens egne ord, men er UDENFOR denne opgaves navngivne omfang (\"Gangben-serien\") og er ikke efterproevet mod raa HTML paa samme niveau som L1/L2. Angivet her, saa et fravalg ikke forveksles med en forglemmelse."
  - "SENSOR-UOVERENSSTEMMELSE MELLEM MARKEDSFOERINGSTEKST OG SPECIFIKATIONSTABEL, IKKE LOEST STILTIENDE: se samme problem paa genisom-gangben-l2.yaml (L2's egen side har samme moenster). L1's egen JSON-specifikationstabel naevner INGEN LiDAR for basismodellen - kun bredvinkelkamera og IMU."
  - "REGELAENDRING (CEO'en, under dette spor): producentens eget materiale ud over produktsiden - PDF-datablade, manualer, udviklerdokumentation - taeller nu ogsaa som gyldig kilde, mod at det maerkes kildetype: sekundaer. Brugt til sdk_sprog nedenfor: github.com/zsibot er GENISOM AI's egen officielle GitHub-organisation (linket direkte fra genisomai.com/download.html: \"官方 GitHub: https://github.com/zsibot/\"). Repoet \"genisom_L1_sdk\" er eksplicit navngivet \"Official SDK for Genisom L1 Series robots\" og README'en skriver \"基于 C++20 开发\" (udviklet med C++20) - ingen ROS/ROS2-omtale i den README. https://github.com/zsibot/genisom_L1_sdk, hentet 2026-08-24."
  - "ROS2 IKKE SAT FOR L1, BEVIDST. Et andet repo i samme organisation, genisom_roamerx_open (\"Open-source navigation stack for GENISOM-AI robots\"), kraever eksplicit \"ROS2 Humble Hawksbill\" og er \"Based on ROS2 Nav2\". Men L1's EGEN produktside naevner ikke navigationssystemet \"RoamerX\" - det er en \"新一代\"/naeste-generations-funktion, som kun staar paa L2's produktside (se genisom-gangben-l2.yaml). Uden den kobling er der ikke grundlag for at saette ros2: ja paa L1 specifikt - feltet staar derfor ikke_oplyst, med denne begrundelse, i stedet for at antage at hele produktfamilien deler samme navigationsstak."
  - "Tredjeparts-WebSearch-sammendrag (ikke direkte efterproevet mod raa HTML) naevner et valgfrit, konfigurerbart sensorsaet for L1 - Intel RealSense dybdekamera, Livox Mid360 LiDAR og NVIDIA Orin NX (op til 100 TOPS) - som IKKE staar i den officielle specifikations-JSON paa produktsiden (den viser kun \"8-kernet CPU\" og bredvinkelkameraet). Ikke medtaget som data, fordi den ikke kunne bekraeftes i raa HTML."
  - "PDF-OPFYLDNINGSRUNDEN (2026-08-25): intet GENISOM-PDF-datablad fundet i arkivet eller paa genisomai.com (kun HTML-produktsider og GitHub). Endnu et repo i zsibot-organisationen, \"genisom_robot_sdk\", blev laest fuldt til - se genisom-gangben-l2.yaml for hvorfor det IKKE blev brugt (tom GitHub-beskrivelse, ingen modelkobling). L1's egen sdk_sprog (C++, fra genisom_L1_sdk) staar uaendret. Ingen andre ikke_oplyst-felter (nyttelast_staaende, forhindring_enkelt, hot_swap, lidar, monteringsinterface, stroem_ud, dataporte, pris, ce_oplyst) kunne fyldes fra det tilgaengelige materiale."
