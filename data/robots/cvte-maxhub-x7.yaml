    advarsel: "\"高度自主 定时启停、自主导航与回充\" (høj autonomi: tidsstyret start/stop, selvnavigation og selvopladning). Nyhedsartiklen (samme domæne) uddyber: \"能够自主规划路径、定时启动任务、完成后自动返航充电\" (kan selv planlægge rute, tidsstyre opgavestart og køre hjem for selv at oplade efter fuldført opgave). Ordet \"docking station\"/\"充电桩\" står ikke ordret nogen af stederne - \"自主...回充\"/\"自动返航充电\" er tolket som en automatisk opladningsfacilitet."
