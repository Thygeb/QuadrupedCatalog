noter:
  - "SVAG SPECIFIKATIONSTÆTHED ER MÅLT, IKKE ANTAGET: CVTE's produktside er en marketing-highlights-side (\"产品亮点\") med retoriske overskrifter og fodnote-forbehold, IKKE en teknisk specifikationstabel som Astrall Dynamics' eller Unitrees produktsider. Der findes intet fundet CVTE-datablad med mål, vægt, nyttelast, hastighed eller DoF. maxhub.com selv (det globale MAXHUB-displaymærke) har INGEN robotprodukter overhovedet - X7 ligger udelukkende under moderselskabet CVTE/视源股份's egen produktnavigation, ikke under maxhub.com."
  - "Producentens egne fodnoter på \"产品亮点\"-siden svækker flere af tallene med vilje: \"*续航时间: 在特定实验室环境(气温25°C、平坦硬质路面等)下持续行走测试所得，实际使用时间因产品配置、环境温度、路面状况、运行速度等因素而异\" (laboratorietal, reel brug varierer); \"*稳定穿越35°陡坡等地形...基于自适应步态算法与电驱动关节的实验室测试结果\" (kan stabilt krydse 35° stejle skråninger m.fl. terræn... baseret på laboratorietestresultater med adaptiv gangart-algoritme og eldrevne led); \"*-20℃至55℃作业：指电池及核心元器件在该温度区间的正常工作范围，极端温度下性能可能部分受影响\" (-20°C til 55°C drift: gælder batteriets og kernekomponenternes normale arbejdsområde i dette temperaturinterval; ydeevnen kan påvirkes delvist ved ekstreme temperaturer). Disse forbehold er gengivet på de enkelte felters advarsel."
  - "MAXHUB X7's SØSTERPRODUKT \"商用清洁机器人\" (kommerciel rengøringsrobot, en ANDEN maskine, ikke firbenet) er den, der ifølge nyhedsartiklen er solgt til Europa/Sydøstasien/Japan (\"进入欧洲、东南亚及日本市场\" - er kommet ind på det europæiske, sydøstasiatiske og japanske marked). Det gælder IKKE X7 - ingen EU-relevante felter er udfyldt for X7 på dette grundlag."
