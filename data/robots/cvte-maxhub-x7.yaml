    advarsel: "Nyhedsartiklen: \"深度融合激光雷达、里程计、IMU、UWB、GNSS、视觉相机等多种传感器\" (dyb fusion af LiDAR, odometri, IMU, UWB, GNSS, visuelt kamera m.fl.). LiDAR nævnes kun som sensor-TYPE i en opremsning - intet antal, ingen model. Tæller ikke som udfyldt under D4's foreløbige regel."
