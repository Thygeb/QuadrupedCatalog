    advarsel: "Producenten oplyser TRE punkter i én sætning: \"40kg负载＞5H，20kg负载＞8H，空载＞11H\". Skemaet har kun ét driftstidsfelt, så mellempunktet (20kg > 8H) er valgt som primær værdi; de to andre (40kg > 5H, 0kg/space > 11H) står her. Fodnote: \"在特定实验室环境(气温25°C、平坦硬质路面等)下持续行走测试所得，实际使用时间因产品配置、环境温度、路面状况、运行速度等因素而异\" (laboratorietal ved 25°C på fladt hardt underlag)."
