    vaerdi: "ikke_oplyst"
    kilde: "https://github.com/zsibot/genisom_roamerx_open"
    hentet: "2026-08-24"
    advarsel: "UNDERSØGT OG BEVIDST IKKE SAT TIL JA, EFTER SELV-TJEK FANGEDE FOR SVAGT BEVIS. L2's egen produktside nævner som en navngiven feature, og producentens GitHub-repo \"genisom_roamerx_open\" kræver eksplicit \"ROS2 Humble Hawksbill\". Første udkast af denne post satte ros2: ja på den kobling. Ved genlæsning af repoets EGEN README står der dog under et afsnit \"Hardware Deployment\": \"TODO\" - producenten skriver selv, at koblingen mellem dette open source-repo og et fysisk, sælgende produkt IKKE er dokumenteret endnu. Et navnesammenfald ('RoamerX') plus et repo, der selv siger 'TODO' til hardware-udrulning, er en gætning, ikke en måling - regel 1. Rettet til ikke oplyst."
    advarsel_ordlyd: "UNDERSØGT OG BEVIDST IKKE SAT TIL JA, EFTER SELV-TJEK FANGEDE FOR SVAGT BEVIS. L2's egen produktside nævner \"新一代 RoamerX 智能导航系统\" som en navngiven feature, og producentens GitHub-repo \"genisom_roamerx_open\" kræver eksplicit \"ROS2 Humble Hawksbill\". Første udkast af denne post satte ros2: ja på den kobling. Ved genlæsning af repoets EGEN README står der dog under et afsnit \"Hardware Deployment\": \"TODO\" - producenten skriver selv, at koblingen mellem dette open source-repo og et fysisk, sælgende produkt IKKE er dokumenteret endnu. Et navnesammenfald ('RoamerX') plus et repo, der selv siger 'TODO' til hardware-udrulning, er en gætning, ikke en måling - regel 1. Rettet til ikke oplyst."
