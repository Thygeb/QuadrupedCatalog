  note: "Samme kilde-sektion som addverb-trakr-5.yaml (\"Industries where we make a difference\") - IKKE arvet_fra, fordi det er den samme primaerkilde begge varianter bor paa, ikke en slutning laant fra en anden robots side (samme princip som GENISOM Gangben L2-W/L2-W Ultra i dette katalog). Se addverb-trakr-5.yaml for den fulde fortolkningsbegrundelse pr. kategori."
noter:
  - "STOPPROEVE (firbenet): BESTAAET, samme grundlag som Trakr 5 - samme produktside, samme quadruped-sprogbrug, samme afsnit foer fane-vaelgeren. Sidens egen broedtekst for netop denne fane: \"Trakr 20 is the heavy-duty quadruped. 20 kg carry, rock-steady under load.\""
  - "STOPPROEVE (reelt produkt): BESTAAET, samme grundlag som Trakr 5 - se den fils noter."
  - "TRAKR 20'S EGEN SPECIFIKATIONSTABEL ER IKKE BRUGT, MED EEN UNDTAGELSE. Den hentede statiske HTML for Trakr 20-fanen (https://addverb.ai/trakr, hentet 2026-08-25) viser MECHANICAL-gruppen med noejagtig samme tal som Trakr 5 (WEIGHT: 18 KG, STANDING HEIGHT: 280 MM, PAYLOAD: 5 KG) - selvom sidens EGEN broedtekst for netop denne fane siger \"20 kg carry\". Det er en direkte selvmodsigelse inden for samme fane. De oevrige otte specifikationsgrupper (MOBILITY, ACTUATION, COMPUTE, COMMUNICATION, SENSORS, ENVIRONMENT, CHARGING, OPTIONAL) staar helt uden vaerdier for denne fane i den hentede HTML - kun gruppeoverskrifter, ingen tal. Vurderet som en overfoerselsfejl i sidens fane-komponent (sandsynligvis Framer-baseret client-side rendering, hvor kun ELECTRICAL & BATTERY-gruppen reelt blev ombundet til fane 2, mens MECHANICAL-gruppens tekstlag beholdt fane 1's statiske vaerdier). ELECTRICAL & BATTERY-gruppen viste AFVIGENDE tal for fane 2 (VOLTAGE 48V mod Trakr 5's 24V, BATTERY CAPACITY 8AH mod 10AH, ENDURANCE 2 HRS mod 1.5 HRS) - disse KUNNE vaere ægte Trakr 20-tal, men er BEVIDST IKKE brugt i denne fil: naar en fane-blok beviseligt indeholder mindst eet forkert tal (payload) uden nogen ekstern bekraeftelse for de oevrige, kan ingen af blokkens tal skelnes fra en fejl (regel 1). WebFetch (uafhaengig AI-opsummering af samme side) naaede samme konklusion: \"the complete TRAKR 20 specification table is not provided in the source material\". Ingen brochure-PDF-link blev fundet i den statiske HTML (kun en \"DOWNLOAD BROCHURE\"-knap uden synligt href) - kunne ikke efterproeves yderligere."
  - "NYTTELAST 20 KG ER DEN ENESTE EGENSKAB, DER HAR UAFHAENGIG BEKRAEFTELSE UD OVER DEN UPAALIDELIGE TABEL: BAADE addverb.ai/trakr's egen broedtekst for Trakr 20-fanen (\"20 kg carry\") OG en selvstaendig kilde paa Addverbs andet eget domaene (addverb.com/press-release/addverb-launches-new-warehouse-robots-trakr-2-0-brisk-and-hoca-at-logimat-india-2025/, 17. feb. 2025, citat af medstifter Bir Singh: \"The Trakr 2.0, a quadruped robot, is capable of carrying up to 20 kg\") bekraefter samme tal uafhaengigt af den fejlbehaeftede specifikationstabel. Presseartiklen er Addverbs eget materiale (citat af egen medstifter, publiceret paa eget domaene addverb.com), IKKE tredjeparts presseomtale - mærket kildetype sekundaer, fordi det ikke er selve produktsiden. \"Trakr 2.0\" er sandsynligvis navnet, Trakr 20 hed foer den nuvaerende Trakr 5/Trakr 20-navngivning (samme 20 kg-taeraskel, samme robottype)."
