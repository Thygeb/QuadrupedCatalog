slug: "bhairav-robotics-shvana"
navn: "Shvana"
producent: "Bhairav Robotics"
producentland: "Indien"
producentby: "Kakinada, Andhra Pradesh"
status: "annonceret"
fremdrift: "ben"
foerste_udgivelse: 2024
noter:
  - "STATUS-VURDERING, IKKE ENTYDIG FRA PRODUCENTEN SELV: Shvana-siden præsenterer robotten med et konkret \"Features\"-specark (samme opbygning som et sælgende produkt), men bruger intetsteds ord som \"available now\", \"in production\", \"order\" eller lignende - eneste handlingsopfordring er \"For more details, email info@bhairavrobotics.com\". Ingen kundecase, ingen leveret enhed nævnt (i modsætning til Keybotic Keypers case study). Sættes derfor til status: annonceret, ikke i_produktion."
  - "COMPUTE BEVIDST IKKE SAT TIL EN VÆRDI: \"Thanks to... onboard computational power, Shvana can quickly adapt\" nævner \"onboard computational power\" uden noget chip-navn, kerneantal eller TOPS-tal. Teksten bærer ingen målbar oplysning ud over at der findes en computer ombord - ikke oplyst er derfor mere ærligt end at gengive en indholdsløs sætning som et \"felt\"."
  - "INGEN DIMENSIONER, IP-KLASSE, TEMPERATUR, BATTERI-Wh, LADETID, DOCKINGSTATION, HOT-SWAP, ROS2, SDK-SPROG, HÆLDNING, FORHINDRINGSHØJDE ELLER PRIS FUNDET NOGEN STEDER PÅ PRODUCENTENS SITE (shvana-robot/, forside, careers, kontakt-side delvist utilgængelig). Alle disse felter står ikke oplyst uden yderligere note, da der intet var at citere - hverken tal, kvalitativ tekst eller modsigelse."
anvendelse:
  vaerdi:
    - "forsvar_beredskab"
    - "industri"
    - "inspektion"
  citat:
    - "Defence & Homeland Security: Shvana can be effectively used by various divisions of armed forces for: Strategic area monitoring | Border patrol & surveillance | Tactical situations | Explosive detection | Search and rescue operations. Shvana also offers the possibility of carrying EW (electronic warfare) payloads, munitions etc., with advanced target tracking software and image recognition capabilities."
    - "Industrial Environments: ... Confined area entry | Hazardous/Corrosive environment inspection | Routine field checks – detecting leaks, abnormal sound, etc | Detecting hotspots | Handling radioactive waste | Fire fighting"
  kilde: "https://bhairavrobotics.com/shvana-robot/"
  hentet: "2026-08-24"
  note: "\"Defence & Homeland Security\" med bevæbnings-/ammunitionsomtale ('munitions', 'EW payloads') -> forsvar og beredskab (IKKE sikkerhed og overvågning - L22 indførte netop den kategori for at skille civil patrulje/overvågning fra militærplatforme, og Shvana er eksplicit \"Bharat's first ARMED quadruped\" for væbnede styrker). \"Industrial Environments\" med \"Hazardous/Corrosive environment inspection\", \"Routine field checks - detecting leaks\" m.fl. -> industri + inspektion."
