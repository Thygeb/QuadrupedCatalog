  - "STATUS ER EN KATALOGBESLUTNING PÅ MÅLT LIGHED, IKKE EN ERKLÆRING FRA PRODUCENTEN. Seks signaler blev sammenlignet mellem CyberDog 1 og CyberDog 2 på mi.com: HTTP-status på produktsiden (200 mod 200), købsknappen køb nu (立即购买, 2 forekomster mod 2), læg-i-kurv-knappen læg i kurv (加入购物车, 0 forekomster mod 0), udsolgt-markering udsolgt (已售罄, 0 mod 0), price-feltet i sidens produkt-JSON (0 mod 0) og is_enable (false mod false). Alle seks er ens. Der findes altså INGEN målbar forskel på producentens side mellem den model, vi fører som i produktion, og den her. Det eneste argument for udgået er, at der findes en efterfølger med et højere generationsnummer - og det er vores slutning, ikke Xiaomis ord."
