    enhed: "°C"
    kilde: https://www.micbotics.com/list_13/96.html
    hentet: 2026-08-24
  temp_maks:
    vaerdi: 55
    enhed: "°C"
    kilde: https://www.micbotics.com/list_13/96.html
    hentet: 2026-08-24
  batteri_wh:
    vaerdi_min: 3500
    vaerdi_maks: 4500
    enhed: Wh
    kilde: https://www.micbotics.com/list_13/96.html
    hentet: 2026-08-24
    advarsel: "Kilden skriver \"Battery Capacity: 3.5/4.5 kwh, Supply Voltage 72V\" - to batteripakke-stoerrelser at vaelge imellem, ikke et maalt interval. Gemt som min/maks, fordi skemaet ikke har et \"to varianter\"-format for et enkeltstaaende tal."
  driftstid:
    vaerdi: 12
    enhed: t
    operator: "<="
    ved_last: ikke_oplyst
    kilde: https://www.micbotics.com/list_13/96.html
    hentet: 2026-08-24
    advarsel: "Etiket \"Max Endurance Time: <=12h\". Ingen lastbetingelse oplyst - kan derfor ikke sammenlignes direkte med en driftstid, der ER lastmaerket."
  hot_swap:
    vaerdi: ja
    kilde: https://www.micbotics.com/public/upload/file/20260416/1776308031204027.pdf
    hentet: 2026-08-25
    kildetype: sekundaer
    advarsel: "PDF-datablad (\"MOVNEWT1 Product Datasheet\", fundet via micbotics.com/support/), side 5: \"Equipped with high-density solid-state dual batteries and a modular quick-swap architecture, it supports hot-swappable battery replacement and provides external battery solutions.\" Ikke naevnt i den strukturerede specifikationstabel paa produktsiden (kilden til de oevrige felter) - kun i databladets prosa-afsnit om batteriarkitektur."
  ladetid: ikke_oplyst
  dockingstation:
    vaerdi: ja
    kilde: https://www.micbotics.com/list_13/96.html
    hentet: 2026-08-24
    advarsel: "Raekken hedder \"Charging Station: Fast Charge\" (kinesisk: label \"充电桩\", vaerdi \"快充\"). Bekraefter en ladestation findes, MEN bekraefter IKKE autonom hjemkoersel/selvopladning - i modsaetning til GENISOM L2's eksplicitte \"包含自主回充功能\" (inkl. autonom genopladningsfunktion). Fortolket som \"ja, der findes en ladestation\", ikke som \"ja, med selvkoerende genopladning\"."
  lidar:
    vaerdi: "Onboard LiDAR (model ikke oplyst)"
    kilde: https://www.micbotics.com/list_13/96.html
    hentet: 2026-08-24
    advarsel: "Kilden markerer kun \"Onboard LiDAR\" med en udfyldt cirkel (til stede), uden model eller linjetal. Type uden model - taeller ikke under D4, naar den indstilling er valgt."
  kameraer:
    vaerdi: "HD Depth Camera, 360° Panoramic Vision, Ultrasonic Radar"
    kilde: https://www.micbotics.com/list_13/96.html
    hentet: 2026-08-24
    advarsel: "Ultrasonic Radar er strengt taget ikke et kamera, men skemaet har intet selvstaendigt radar-felt under sensorik - listet her for ikke at miste oplysningen."
  compute:
    vaerdi: "Jetson Orin NX Super + RK3588, 181 TOPS"
    kilde: https://www.micbotics.com/list_13/96.html
    hentet: 2026-08-24
  ros2: ikke_oplyst
  sdk_sprog: ikke_oplyst
  autonominiveau:
    vaerdi: "NeuroFuse multimodal perception + CogniDecide AI decision engine: environmental perception, task planning, knowledge reasoning, human-robot interaction"
    kilde: https://www.micbotics.com/list_13/96.html
    hentet: 2026-08-24
    advarsel: "Kvalitativ beskrivelse af producentens egne systemnavne, ikke et niveau paa en skala."
  monteringsinterface:
    vaerdi: "Topmonteret udvidelsesinterface (\"Top Mount Expansion\") samt undervogns-udvidelsesinterface (\"Undercarriage Expansion\"), begge markeret som standardfunktion i databladets funktionstabel. Ingen standardiseret monteringsflade-navn, -maal eller hurtigskift-mekanisme oplyst."
    kilde: https://www.micbotics.com/public/upload/file/20260416/1776308031204027.pdf
    hentet: 2026-08-25
    kildetype: sekundaer
    advarsel: "PDF-datablad, side 8 (\"Parameter Information\"), afsnit \"Functionality\": raekkerne \"Top Mount Expansion\" og \"Undercarriage Expansion\" er begge markeret med en prik (til stede), uden yderligere specifikation af interface-standard, maal eller belastningsevne."
  stroem_ud:
    vaerdi: "AC220V / 12V DC OUTLET (dual-mode, automotive-grade effektudgangsstandard, via \"quick interface matrix\"). 12V DC OUTLET: 10A maks. (ISO 4165). AC-side: 220V ±7% i Kina/Sydoestasien (GB/T 12325-2008); 120V/240V i Nordamerika; nominelt 230V ±10% i EU (reelt kompatibel med 220V)."
    kilde: https://www.micbotics.com/public/upload/file/20260416/1776308031204027.pdf
    hentet: 2026-08-25
    kildetype: sekundaer
    advarsel: "PDF-datablad, side 5: \"Featuring automotive-grade power output standards (supporting AC220V / 12V DC OUTLET dual-mode), it is compatible with multi-scenario devices via a quick interface matrix\", med fodnoter om regionale AC-spaendingstolerancer og \"12V DC OUTLET - 10A maximum, compliant with ISO 4165\". Watt-tal for AC-siden ikke eksplicit oplyst (kun spaending); 12V-siden giver 120W ved 10A, men producenten skriver ikke selv dette udregnede tal, saa kun de trykte A/V-vaerdier er gengivet."
  dataporte: ikke_oplyst
  pris: ikke_oplyst
  ce_oplyst: ikke_oplyst
