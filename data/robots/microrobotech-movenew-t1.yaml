  stroem_ud:
    vaerdi: "AC220V / 12V DC OUTLET (dual-mode, automotive-grade effektudgangsstandard, via \"quick interface matrix\"). 12V DC OUTLET: 10A maks. (ISO 4165). AC-side: 220V ±7% i Kina/Sydøstasien (GB/T 12325-2008); 120V/240V i Nordamerika; nominelt 230V ±10% i EU (reelt kompatibel med 220V)."
    kilde: "https://www.micbotics.com/public/upload/file/20260416/1776308031204027.pdf"
    hentet: "2026-08-25"
    kildetype: "sekundaer"
    advarsel: "PDF-datablad, side 5: \"Featuring automotive-grade power output standards (supporting AC220V / 12V DC OUTLET dual-mode), it is compatible with multi-scenario devices via a quick interface matrix\", med fodnoter om regionale AC-spændingstolerancer og \"12V DC OUTLET - 10A maximum, compliant with ISO 4165\". Watt-tal for AC-siden ikke eksplicit oplyst (kun spænding); 12V-siden giver 120W ved 10A, men producenten skriver ikke selv dette udregnede tal, så kun de trykte A/V-værdier er gengivet."
