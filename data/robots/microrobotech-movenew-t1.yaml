  hot_swap:
    vaerdi: true
    kilde: "https://www.micbotics.com/public/upload/file/20260416/1776308031204027.pdf"
    hentet: "2026-08-25"
    kildetype: "sekundaer"
    advarsel: "PDF-datablad (\"MOVNEWT1 Product Datasheet\", fundet via micbotics.com/support/), side 5: \"Equipped with high-density solid-state dual batteries and a modular quick-swap architecture, it supports hot-swappable battery replacement and provides external battery solutions.\" Ikke nævnt i den strukturerede specifikationstabel på produktsiden (kilden til de øvrige felter) - kun i databladets prosa-afsnit om batteriarkitektur."
  ladetid: "ikke_oplyst"
  dockingstation:
    vaerdi: true
    kilde: "https://www.micbotics.com/list_13/96.html"
    hentet: "2026-08-24"
    advarsel: "Rækken hedder \"Charging Station: Fast Charge\" (kinesisk: label, værdi). Bekræfter en ladestation findes, MEN bekræfter IKKE autonom hjemkørsel/selvopladning - i modsætning til GENISOM L2's eksplicitte (inkl. autonom genopladningsfunktion). Fortolket som \"ja, der findes en ladestation\", ikke som \"ja, med selvkørende genopladning\"."
    advarsel_ordlyd: "Rækken hedder \"Charging Station: Fast Charge\" (kinesisk: label \"充电桩\", værdi \"快充\"). Bekræfter en ladestation findes, MEN bekræfter IKKE autonom hjemkørsel/selvopladning - i modsætning til GENISOM L2's eksplicitte \"包含自主回充功能\" (inkl. autonom genopladningsfunktion). Fortolket som \"ja, der findes en ladestation\", ikke som \"ja, med selvkørende genopladning\"."
