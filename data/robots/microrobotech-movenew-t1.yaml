slug: microrobotech-movenew-t1
navn: MOVENEW T1
producent: MicroRoboTech
producentland: Kina
producentby: Hangzhou
status: i_produktion
noter:
  - "STOPPROEVE (firbenet): bestaaet. Producentens egen produktside skriver i meta-keywords \"Micbot, quadruped robot, ...\" og i meta-description \"Micbot's quadruped robot features... (70kg dynamic load, 200kg static load)...\" (https://www.micbotics.com/list_13/96.html, hentet 2026-08-24). T1 er en hjul-ben-hybrid (\"wheeled quadruped\"/\"轮式四足机器人\") - opgaven definerer hjul-ben-hybrider som firbenede, saa den taeller."
  - "PRODUCENTEN HAR SKIFTET NAVN/DOMAENE. Domaenet CEO'ens opgave og pressen bruger (microrobotech.com) omdirigerer 301 til micbotics.com. Hele det nuvaerende site bruger brandnavnet \"Micbot\"/\"MICBOT\" (meta-keywords, sidens titel-tags \"...-MICBOT\", navigationslogo) - IKKE \"MicroRoboTech\". Det juridiske firmanavn er fortsat 杭州具微科技有限公司 (Hangzhou Juwei Technology), som 36Kr's projektside oversaetter til \"MicroRoboTech\" (https://pitchhub.36kr.com/project/3401143382263687, hentet 2026-08-24). Producent-feltet her bevarer CEO'ens navngivning \"MicroRoboTech\", men det forbrugervendte brand at lede efter i fremtiden er \"Micbot\"."
  - "Datasheet-tabellen er identisk paa engelsk (micbotics.com) og kinesisk (micbotics.cn) site - alle 25+ raekker krydstjekket ordret, 0 afvigelser. Den engelske version er derfor brugt direkte som kilde uden oversaettelsesrisiko for selve tallene."
  - "Foldet maal 1025 x 750 x 150 mm er oplyst men har intet skemafelt (skemaet har kun staaende maal)."
  - "\"Total Battery Weight: 40~50kg\" / kinesisk \"整机电机重量\" er en tvetydig etikette (blander \"整机重量\", helmaskinevaegt, med \"电池\", batteri). Placeret som egenvaegt ud fra sammenhaengen (staar under \"Mechanical Parameters\" sammen med maalene, ikke under \"Electrical Parameters\"), men ordlyden er ikke entydig - se advarsel paa feltet."
  - "Ingen pris fundet paa nogen af de to sprogversioner - kun \"Buy Now\"/\"Get Solutions\"-kontaktknapper, intet trykt tal."
  # INTERN PROCESNOTE (flyttet fra noter, KRITIK-2 fund 1 25. aug 2026):
  # PDF-URL https://www.micbotics.com/public/upload/file/20260416/
  # 1776308031204027.pdf. Ikke laest i foerste forsoeg, fordi hverken
  # pdftoppm/poppler-utils, WebFetch (HTTP 403) eller et Python+zlib-forsoeg
  # kunne trakke laesbar tekst ud (se opfoelgningsnoten nedenfor for hvordan
  # det senere lykkedes).
  - "Producentens support-side (https://www.micbotics.com/support/, hentet 2026-08-24) har en rigtig, downloadbar PDF: \"MOVNEWT1 Product Datasheet\" (13,2 MB). Den blev hentet, men kunne ikke laeses i foerste omgang - ingen data herfra var brugt i posten paa det tidspunkt. \"T1 SDK Development Guide\", \"T1 Operation Guide\" og \"Micbot Reinforcement Learning/Perception SDK Developer Guide\" staar ogsaa paa support-siden, men alle fire har tomme download-links paa hentetidspunktet - ikke publicerede endnu, intet at hente."
  - "OPFOELGNING 2026-08-25 (PDF-opfyldningsrunde, L33): poppler er stadig ikke installeret paa maskinen (bekraeftet paa ny), og WebFetch giver stadig HTTP 403 paa PDF'en direkte - men et npm-pakke-baseret pure-JS-alternativ (pdf-parse v2, installeret i en scratch-mappe uden for repoet, IKKE en projektafhaengighed) kunne rendere PDF-siderne til PNG-billeder, som derefter blev laest visuelt side for side med Read-vaerktoejet. PDF'en (12 sider) viste sig at vaere naesten teksttom (kun sideskift-tegn ved almindelig tekstudtraek) - dvs. rent visuel/vektorgrafik, hvilket forklarer hvorfor det tidligere Python+zlib-forsoeg intet fandt. Spec-tabellen star paa side 8, en batteri-/effektside paa side 5. Evidens: media/_kilder/raa-pdf-2026-08-24/t1-pages/page-{1..12}.png. Tre nye felter udfyldt herfra (hot_swap, stroem_ud, monteringsinterface); resten af PDF'ens indhold bekraefter allerede udfyldte felter (se advarsler nedenfor) uden at tilfoeje nyt."
  - "EFTERPROEVET AF EFTERFOELGENDE AGENT (2026-08-25), UCOMMITTET ARV: de tre felter ovenfor (hot_swap, stroem_ud, monteringsinterface) var skrevet af en forgaenger-agent, hvis session doede foer commit. Alle tre er genefterproevet mod kilden - t1-pages/page-5.png og page-8.png laest paa ny med oejne - og citaterne stemmer ordret. Alle tre BEHOLDT uaendret. Samtlige oevrige 10 sider (page-1 til -4, -6, -7, -9 til -12) er ogsaa gennemgaaet paa ny: ingen yderligere skemafelter fundet ud over de tre allerede skrevne (siderne er marketingprosa om DynaCore/DynaForce-motorteknologi, sensoropstilling, anvendelsesscenarier, farve-/materialevalg og virksomhedskontakt - intet om pris, CE, ROS2, SDK-sprog eller dataporte). Ingen modsigelser fundet mellem PDF'ens \"Parameter Information\"-tabel (side 8) og de allerede udfyldte felter fra produktsiden - alle sammenlignelige tal (maal, vaegt, hastighed, driftstid, nyttelast, haeldning, trappetrin, IP-klasse, temp) stemmer overens."
