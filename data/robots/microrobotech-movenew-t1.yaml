    advarsel_ordlyd: "Featuring automotive-grade power output standards (supporting AC220V / 12V DC OUTLET dual-mode), it is compatible with multi-scenario devices via a quick interface matrix. | 12V DC OUTLET - 10A maximum, compliant with ISO 4165."
