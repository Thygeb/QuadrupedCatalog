felter:
  egenvaegt:
    vaerdi_min: 40
    vaerdi_maks: 50
    enhed: kg
    kilde: https://www.micbotics.com/list_13/96.html
    hentet: 2026-08-24
    advarsel: "Etiket \"Total Battery Weight\" (kinesisk \"整机电池重量\") - ordret \"helmaskine-batteri-vaegt\", en sammenblandet etikette. Placeret som egenvaegt (med batteri), fordi raekken staar under \"Mechanical Parameters\" ved siden af maalene, ikke under \"Electrical Parameters\". Ikke en tastefejl fra vores side - producentens egen etikette er tvetydig."
  laengde:
    vaerdi: 800
    enhed: mm
    kilde: https://www.micbotics.com/list_13/96.html
    hentet: 2026-08-24
    advarsel: "\"Standing Dimensions: 800mm x 600mm x 540mm\" - producenten maerker ikke akserne. Braekkefoelgen laengde x bredde x hoejde er antaget efter saedvane, ikke bekraeftet af kilden (samme usikkerhed som deep-robotics-x30)."
  bredde:
    vaerdi: 600
    enhed: mm
    kilde: https://www.micbotics.com/list_13/96.html
    hentet: 2026-08-24
    advarsel: "USIKKER TILDELING - se laengde. Akserne er ikke maerket i kilden."
  hoejde:
    vaerdi: 540
    enhed: mm
    kilde: https://www.micbotics.com/list_13/96.html
    hentet: 2026-08-24
    advarsel: "USIKKER TILDELING - se laengde. Foldet maal er 1025 x 750 x 150 mm; skemaet har intet foldefelt."
  frihedsgrader:
    vaerdi: 16
    enhed: DoF
    kilde: https://www.micbotics.com/list_13/96.html
    hentet: 2026-08-24
    advarsel: "Producenten skriver \"High-Performance Motors: 16 units\", ikke \"Degrees of Freedom\". T1 er en hjul-ben-hybrid, saa de 16 motorer daekker formentlig baade ben-led og hjulnav - ikke noedvendigvis 16 rene bevaegelsesfrihedsgrader. Samme fortolkning som Go2's motor-optaelling."
  nyttelast_gaaende:
    vaerdi: 50
    enhed: kg
    kilde: https://www.micbotics.com/list_13/96.html
    hentet: 2026-08-24
    advarsel: "Etiket \"Continuous Walking Load\"."
  nyttelast_staaende:
    vaerdi: 100
    enhed: kg
    kilde: https://www.micbotics.com/list_13/96.html
    hentet: 2026-08-24
    advarsel: "Etiket \"Max Standing Load\"."
  hastighed:
    vaerdi: 18
    enhed: km/h
    kilde: https://www.micbotics.com/list_13/96.html
    hentet: 2026-08-24
    advarsel: "Etiket \"Max Moving Speed\" - et loft, ikke en vedvarende driftshastighed. Ingen operator tilfoejet, da \"Max\" her er en etikette (jf. skillens sondring mellem etikette og operator)."
  haeldning:
    vaerdi: 45
    enhed: "°"
    operator: "<="
    kilde: https://www.micbotics.com/list_13/96.html
    hentet: 2026-08-24
    advarsel: "Kilden trykker tegnet U+2264 (<=) foran 45° under \"Slope Capability\" - et LOFT, samme moenster som X30's advarsel om samme tegn hos en anden producent."
  forhindring_enkelt:
    vaerdi: 40
    enhed: cm
    kilde: https://www.micbotics.com/list_13/96.html
    hentet: 2026-08-24
    advarsel: "Etiket \"Step Negotiation\": \"Forward climbing up/down 40cm steps\"."
  trappetrin_kontinuerlig:
    vaerdi: 25
    enhed: cm
    kilde: https://www.micbotics.com/list_13/96.html
    hentet: 2026-08-24
    advarsel: "Etiket \"Stair Climbing Capability\": \"Max step height 25cm\". Adskilt fra forhindring_enkelt, fordi kilden selv bruger to forskellige etiketter og to forskellige tal (25 cm vs. 40 cm) for de to begreber - modsat X30, hvor de stod som ét kombineret felt."
