  note: "Første citat er YJ30 W's egen produktbeskrivelse (samme side). Egen oversættelse: 多光谱火情探测/火情预警 (multispektral brandfaredetektion/-varsling) -> forsvar og beredskab; 自主移动巡检/自主巡逻 (autonom mobil inspektion/patrulje) -> inspektion; 工业 -> industri; 科研 -> forskning og udvikling. \"仓储\" (lager/logistik) er IKKE medtaget som logistik-kategori her, da det kun står i en opremsning af mulige indsatsmiljøer (\"工业、仓储、科研等复杂场景\"), ikke som en selvstændig anvendelseskategori på linje med de øvrige - en mere forsigtig læsning end den bredeste mulige. De to sidste citater er fra sidens delte \"行业应用\"-sektion: \"警用巡逻\" -> sikkerhed og overvågning."
noter:
