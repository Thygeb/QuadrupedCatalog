  note_ordlyd: "The first quote is the YJ30 W's own product description (same page). Our own translation: 多光谱火情探测/火情预警 (multispectral fire detection/warning) -> defense and emergency response; 自主移动巡检/自主巡逻 (autonomous mobile inspection/patrol) -> inspection; 工业 -> industry; 科研 -> research and development. \"仓储\" (warehousing/logistics) is NOT included as a logistics category here, since it appears only in a list of possible deployment environments (\"工业、仓储、科研等复杂场景\"), not as a standalone application category alongside the others - a more cautious reading than the broadest possible one. The last two quotes are from the page's shared \"行业应用\" section: \"警用巡逻\" -> security and surveillance."
