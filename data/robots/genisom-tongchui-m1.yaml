felter:
  egenvaegt:
    vaerdi: 41
    enhed: kg
    kilde: https://www.genisomai.com/product-robot/M1
    hentet: 2026-08-24
    advarsel: "\"整机重量（含电池）: 41 kg\" i den strukturerede specifikationstabel - ingen \"约\" (cirka)-markering. MODSIGES af sidens eget marketingkort: \"约 30kg 整机重量（同级别最轻量），约 30kg 持续作业负载，在四足机器人行业内首次实现近 1:1 负载自重比\" (ca. 30kg egenvægt, ca. 30kg vedvarende last, næsten 1:1-forhold). De to tal (41kg vs. 30kg) er den samme robots egenvægt på den SAMME side og står i modstrid. Regel 9: rettes ikke stiltiende. Den strukturerede tabel er brugt som feltværdi, fordi den er den mest specifikke kilde (samme princip som resten af GENISOM-posterne), men uoverensstemmelsen er ikke bortforklaret."
    advarsel_klasse: "gyldighed"
