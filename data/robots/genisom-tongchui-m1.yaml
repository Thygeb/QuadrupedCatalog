    advarsel: "Tilbehørsliste: \"充电座: 标配\" (ladesokkel, standardudstyr). Marketingteksten nævner separat \"可选配智能充电桩，支持低电量自主返回充电\" (tilvalgt intelligent ladestation med autonom hjemkørsel ved lav ladning) - kun tilvalgt, ikke standard. Samme to-niveau-mønster som L1/L2's dockingstation."
  lidar:
    vaerdi: "3D LiDAR (type og model ikke oplyst)"
    kilde: https://www.genisomai.com/product-robot/M1
    hentet: 2026-08-24
    advarsel: "\"3D激光雷达: 支持\" i den strukturerede sensor-sektion - bekræfter tilstedeværelse, men hverken linjetal, model eller producent er oplyst (modsat L2-W Ultra, der navngiver \"96线激光雷达\")."
  kameraer:
    vaerdi: "2x bredvinkelkamera, 8 MP hver, DFOV 122° / HFOV 111° / VFOV 70°"
    kilde: https://www.genisomai.com/product-robot/M1
    hentet: 2026-08-24
    advarsel: "\"相机类型: 广角相机 x 2, DFOV 122°，HFOV 111°，VFOV 70°\" og \"相机像索: 800万 x 2\". Sensor-sektionen nævner også \"深度相机\" (dybdekamera) og \"RTK定位模块\" (RTK-positioneringsmodul) uden yderligere specifikation - skemaet har intet dedikeret felt til nogen af de to."
  compute:
    vaerdi: "8-kernet CPU, 100 TOPS"
    kilde: https://www.genisomai.com/product-robot/M1
    hentet: 2026-08-24
    advarsel: "\"基础算力: 8 核高性能 CPU （100TOPS）\"."
  ros2: ikke_oplyst
  sdk_sprog:
    vaerdi: ikke_oplyst
    kilde: https://github.com/zsibot/genisom_robot_sdk
    hentet: 2026-08-24
    advarsel: "UNDERSØGT, MEN IKKE SAT. GENISOM AI's GitHub-organisation (zsibot) har et repo \"genisom_robot_sdk\" (README: \"Programming Language: C++\", Ubuntu 22.04/CMake/GCC/Boost), men repoet har INGEN GitHub-beskrivelse, der binder det til et specifikt produktnavn (modsat \"genisom_L1_sdk\", som eksplicit hedder \"Official SDK for Genisom L1 Series robots\"). Hverken \"M1\" eller \"铜锤\" står i den udtrukne README-tekst. At bruge repoet til M1 ville være samme slags navnesammenfald-uden-bevis, som blev fanget og afvist på L2's ros2-felt i forrige runde - derfor ikke oplyst i stedet for et gæt."
  autonominiveau:
    vaerdi: "AI强化学习运控 (标配); 基础动作 (踏步/滑行/匍匐等姿态, 前后左右直线移动, 原地旋转, 膝关节姿态变换, 支持砂石路/柏油路/草地/沙地/森林地面/建筑废墟等路面); 特技动作 (爬高墙/过挡鼠板/过窄墙/扭一扭等); 实时图像传输; OTA升级; 二次开发支持; 自主导航 (选配: 智航Pro版, 建图/定位/导航/避障); 智能避障"
    kilde: https://www.genisomai.com/product-robot/M1
    hentet: 2026-08-24
    advarsel: "Kvalitativ liste fra producentens funktionsafsnit, ikke et niveau på en skala. Selvstændig navigation står eksplicit som TILVALG (\"选配\"), ikke standard."
  monteringsinterface: ikke_oplyst
  stroem_ud: ikke_oplyst
  dataporte:
    vaerdi: ["Gigabit netvaerksport x2", "USB 3.0 x2", "RS232 x1", "RS485 x1", "SBUS x2", "PPS x1"]
    kilde: https://www.genisomai.com/product-robot/M1
    hentet: 2026-08-24
    advarsel: "\"功能拓展接口: 千兆网口 ×2、USB 3.0 ×2、RS232 ×1、RS485 ×1、SBUS ×2、PPS ×1\" fra den strukturerede specifikationstabel (2+2+1+1+2+1 = 9 navngivne porte i alt). Marketingteksten påstår separat \"15 大标准硬件接口全开放\" (15 standardinterfaces i alt) - et højere, ikke-specificeret tal, som IKKE er brugt som feltværdi. De 9 navngivne porte er brugt, fordi de er den eneste itemiserede kilde; 15-tallet er noteret som en uafklaret uoverensstemmelse, ikke rettet stiltiende."
  pris: ikke_oplyst
  ce_oplyst: ikke_oplyst
