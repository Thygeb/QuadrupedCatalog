slug: genisom-tongchui-m1
navn: Tongchui M1
producent: GENISOM AI
producentland: Kina
producentby: Beijing / Suzhou
status: i_produktion
anvendelse:
  vaerdi: [forsvar_beredskab, inspektion, sikkerhed_overvaagning, logistik]
  citat: ["森林消防", "石化消防", "电力巡检", "园区巡逻", "物流运输"]
  kilde: https://www.genisomai.com/product-robot/M1
  hentet: 2026-08-24
  note: "Fra sektionen \"下一个应用场景，它已提前就位\" (næste anvendelsesscenarie, allerede klar) på M1's egen produktside. Egen oversættelse: 森林消防 (skovbrandbekæmpelse) -> forsvar og beredskab; 石化消防 (petrokemisk brandbekæmpelse) -> forsvar og beredskab (samme kategori, to citater); 电力巡检 (elkraftinspektion) -> inspektion; 园区巡逻 (områdepatrulje) -> sikkerhed og overvågning; 物流运输 (logistiktransport) -> logistik."
noter:
  - "META-DESCRIPTIONS \"16个自由度\" MODSIGES AF DEN STRUKTUREREDE SPECIFIKATIONSTABEL, IKKE LØST STILTIENDE: metabeskrivelsen påstår 16 frihedsgrader, men den strukturerede tabel (samme side) skriver eksplicit \"关节电机数量: 12 个\" - samme mønster som L1/L2 (ledmotor-antal, ikke eksplicit \"frihedsgrader\"). 12 er brugt som feltværdi, fordi det står i den strukturerede tabel; 16-tallet fra metabeskrivelsen er IKKE brugt, og uoverensstemmelsen er noteret her i stedet for at blive rettet stiltiende."
  - "VÆGT-UOVERENSSTEMMELSE PÅ SAMME SIDE, IKKE LØST STILTIENDE: se advarslen på egenvægt nedenfor - marketingteksten påstår \"næsten 1:1 negativt/positivt last-egenvægt-forhold\" ud fra en \"~30kg\"-vægt, mens den strukturerede tabel siger 41 kg."
  - "KONKURRENCE- OG MARATHON-PÅSTANDE, CITERET MEN IKKE EFTERPRØVET UD OVER PRODUCENTENS EGEN SIDE: \"2026北京亦庄机器人勇士挑战赛，铜锤M1 自主导航项目全场唯一完赛，并斩获四足机器人大类自主导航第一、奖项数第一、总分第一、速度第一\" (2026 Beijing Yizhuang Robot Warrior-udfordringen - M1 var det eneste hold, der gennemførte den autonome navigationsdisciplin, og vandt førstepladsen i autonom navigation, flest priser, højeste totalscore og hurtigst i firbenet-kategorien). Samt: \"全球首次由自主跟随机器人陪人类完成马拉松赛事... 铜锤M1作为全球首个自主跟随的机器人\"关门兔\"完成半马陪跑任务\" (første gang globalt en autonomt følgende robot fuldførte et marathon sammen med et menneske - M1 fungerede som verdens første autonomt følgende \"sweep hare\" på en halvmaraton). Ingen af de to hører til i de 30 skemafelter - noteret her som producentcitat, ikke som et efterprøvet tredjepartsfaktum."
