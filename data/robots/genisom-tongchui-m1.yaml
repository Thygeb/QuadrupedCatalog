slug: genisom-tongchui-m1
navn: Tongchui M1
producent: GENISOM AI
producentland: Kina
producentby: Beijing / Suzhou
status: i_produktion
anvendelse:
  vaerdi: [forsvar_beredskab, inspektion, sikkerhed_overvaagning, logistik]
  citat: ["森林消防", "石化消防", "电力巡检", "园区巡逻", "物流运输"]
  kilde: https://www.genisomai.com/product-robot/M1
  hentet: 2026-08-24
  note: "Fra sektionen \"下一个应用场景，它已提前就位\" (naeste anvendelsesscenarie, allerede klar) paa M1's egen produktside. Egen oversaettelse: 森林消防 (skovbrandbekaempelse) -> forsvar_beredskab; 石化消防 (petrokemisk brandbekaempelse) -> forsvar_beredskab (samme kategori, to citater); 电力巡检 (elkraftinspektion) -> inspektion; 园区巡逻 (omraadepatrulje) -> sikkerhed_overvaagning; 物流运输 (logistiktransport) -> logistik."
noter:
  - "STOPPROEVE (firbenet): bestaaet, entydigt. Meta-keywords paa M1's egen produktside: \"具身智能,四足机器人,机器狗,行业级机器人,...\". Meta-description: \"铜锤M1是智身科技推出的中型行业级四足机器人，16个自由度\" (Tongchui M1 er GENISOM AI's mellemklasse industriklasse firbenede robot, 16 frihedsgrader). Sidens egen overskrift: \"铜锤 M1 - 行业首款轻体型、高负载、全防护四足机器人\" (industriens foerste lette, hoejtbelastede, fuldt beskyttede firbenede robot). https://www.genisomai.com/product-robot/M1, hentet 2026-08-24. Selvstaendig produktlinje - hverken \"钢镚\"(Gangben) eller en dublet af L1/L2."
  - "META-DESCRIPTIONS \"16个自由度\" MODSIGES AF DEN STRUKTUREREDE SPECIFIKATIONSTABEL, IKKE LOEST STILTIENDE: metabeskrivelsen paastaar 16 frihedsgrader, men den strukturerede tabel (samme side) skriver eksplicit \"关节电机数量: 12 个\" - samme moenster som L1/L2 (ledmotor-antal, ikke eksplicit \"frihedsgrader\"). 12 er brugt som feltvaerdi, fordi det staar i den strukturerede tabel; 16-tallet fra metabeskrivelsen er IKKE brugt, og uoverensstemmelsen er noteret her i stedet for at blive rettet stiltiende."
  - "VAEGT-UOVERENSSTEMMELSE PAA SAMME SIDE, IKKE LOEST STILTIENDE: se advarslen paa egenvaegt nedenfor - marketingteksten paastaar \"naesten 1:1 negativt/positivt last-egenvaegt-forhold\" ud fra en \"~30kg\"-vaegt, mens den strukturerede tabel siger 41 kg."
  - "KONKURRENCE- OG MARATHON-PAASTANDE, CITERET MEN IKKE EFTERPROEVET UD OVER PRODUCENTENS EGEN SIDE: \"2026北京亦庄机器人勇士挑战赛，铜锤M1 自主导航项目全场唯一完赛，并斩获四足机器人大类自主导航第一、奖项数第一、总分第一、速度第一\" (2026 Beijing Yizhuang Robot Warrior-udfordringen - M1 var det eneste hold, der gennemfoerte den autonome navigationsdisciplin, og vandt foerstepladsen i autonom navigation, flest priser, hoejeste totalscore og hurtigst i firbenet-kategorien). Samt: \"全球首次由自主跟随机器人陪人类完成马拉松赛事... 铜锤M1作为全球首个自主跟随的机器人\"关门兔\"完成半马陪跑任务\" (foerste gang globalt en autonomt foelgende robot fuldfoerte et marathon sammen med et menneske - M1 fungerede som verdens foerste autonomt foelgende \"sweep hare\" paa en halvmaraton). Ingen af de to hoerer til i de 30 skemafelter - noteret her som producentcitat, ikke som et efterproevet tredjepartsfaktum."
  - "M1 HAR TO YDERLIGERE TIER-VARIANTER PAA SAMME SIDE, IKKE BYGGET: samme techParamsData-JSON som base-M1 rummer ogsaa \"铜锤 M1 Pro\" (tilfoejer UWB-modul, mikrofon/hoejtaler, taleopkald, RTK) og \"铜锤 M1 Ultra\" (tilfoejer 720° panoramasyn med fire fiskeoejekameraer). Begge er nye fund udenfor denne opgaves navngivne omfang (\"Tongchui M1\" i FUND-kand1b.md) - dokumenteret her, saa et fravalg ikke forveksles med en forglemmelse, samme princip som L2-W/L2-W Ultra fik i forrige runde."
felter:
  egenvaegt:
    vaerdi: 41
    enhed: kg
    kilde: https://www.genisomai.com/product-robot/M1
    hentet: 2026-08-24
    advarsel: "\"整机重量（含电池）: 41 kg\" i den strukturerede specifikationstabel - ingen \"约\" (cirka)-markering. MODSIGES af sidens eget marketingkort: \"约 30kg 整机重量（同级别最轻量），约 30kg 持续作业负载，在四足机器人行业内首次实现近 1:1 负载自重比\" (ca. 30kg egenvaegt, ca. 30kg vedvarende last, naesten 1:1-forhold). De to tal (41kg vs. 30kg) er den samme robots egenvaegt paa den SAMME side og staar i modstrid. Regel 9: rettes ikke stiltiende. Den strukturerede tabel er brugt som feltvaerdi, fordi den er den mest specifikke kilde (samme princip som resten af GENISOM-posterne), men uoverensstemmelsen er ikke bortforklaret."
  laengde:
