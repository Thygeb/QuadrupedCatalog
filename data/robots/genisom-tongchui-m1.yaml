    vaerdi: "AI强化学习运控 (标配); 基础动作 (踏步/滑行/匍匐等姿态, 前后左右直线移动, 原地旋转, 膝关节姿态变换, 支持砂石路/柏油路/草地/沙地/森林地面/建筑废墟等路面); 特技动作 (爬高墙/过挡鼠板/过窄墙/扭一扭等); 实时图像传输; OTA升级; 二次开发支持; 自主导航 (选配: 智航Pro版, 建图/定位/导航/避障); 智能避障"
    kilde: https://www.genisomai.com/product-robot/M1
    hentet: 2026-08-24
    advarsel: "Kvalitativ liste fra producentens funktionsafsnit, ikke et niveau paa en skala. Selvstaendig navigation staar eksplicit som TILVALG (\"选配\"), ikke standard."
  monteringsinterface: ikke_oplyst
  stroem_ud: ikke_oplyst
  dataporte:
    vaerdi: ["Gigabit netvaerksport x2", "USB 3.0 x2", "RS232 x1", "RS485 x1", "SBUS x2", "PPS x1"]
    kilde: https://www.genisomai.com/product-robot/M1
