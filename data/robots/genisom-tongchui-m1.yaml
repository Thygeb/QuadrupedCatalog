    advarsel: "Tilbehørsliste oplyser \"电池\": \"54 V，9.35 Ah × 2；双电池，热插拔\" (54V, 2x 9,35 Ah, dobbelt batteri, hot-swap). Wh er IKKE trykt direkte, og vi udregner ikke Wh af Ah x V (regel 9)."
  driftstid:
    vaerdi_min: 3.5
    vaerdi_maks: 5
    enhed: t
    ved_last: ikke_oplyst
    kilde: https://www.genisomai.com/product-robot/M1
    hentet: 2026-08-24
    advarsel: "\"续航时间: 空载 5 h；满载 3.5 h\" (5t tomgang / 3,5t fuld last). Kvalitativ lastbetingelse (tom/fuld), intet kg-tal knyttet direkte til denne række - derfor er lastbetingelsen ikke oplyst, selvom et separat \"最大载荷: 30 kg\" står andetsteds på siden. Rækkevidde \"续航里程: 空载 29 km；满载 18 km\" er også oplyst; skemaet har intet rækkeviddefelt."
    advarsel_klasse: "gyldighed"
  hot_swap:
    vaerdi: ja
    kilde: https://www.genisomai.com/product-robot/M1
    hentet: 2026-08-24
