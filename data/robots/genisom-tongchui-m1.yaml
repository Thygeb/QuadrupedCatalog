    hentet: 2026-08-24
    advarsel: "UNDERSOEGT, MEN IKKE SAT. GENISOM AI's GitHub-organisation (zsibot) har et repo \"genisom_robot_sdk\" (README: \"Programming Language: C++\", Ubuntu 22.04/CMake/GCC/Boost), men repoet har INGEN GitHub-beskrivelse, der binder det til et specifikt produktnavn (modsat \"genisom_L1_sdk\", som eksplicit hedder \"Official SDK for Genisom L1 Series robots\"). Hverken \"M1\" eller \"铜锤\" staar i den udtrukne README-tekst. At bruge repoet til M1 ville vaere samme slags navnesammenfald-uden-bevis, som blev fanget og afvist paa L2's ros2-felt i forrige runde - derfor ikke_oplyst i stedet for et gaet."
