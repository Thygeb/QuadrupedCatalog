noter:
  - "HOME CITY IS SUZHOU, NOT WUJIANG: the manufacturer’s global site states directly \"Founded in 2024 and headquartered in Suzhou\" and repeats \"Founded in Suzhou, China\". The string \"Wujiang\", which the record previously carried alongside Suzhou, appears 0 times across the company’s archived pages."
  - "TWO MANUFACTURER SITES THAT CONTRADICT EACH OTHER — and here the operators flip. magiclab.top states speed 0-3 m/s and slope <= 40 degrees; magiclabglobal.com states >= 3.0 m/s and >= 40 degrees for the same robot, the same language, the same day. One is a ceiling, the other a floor. The source used here is magiclab.top; the global site’s figures are recorded in the caveats."
