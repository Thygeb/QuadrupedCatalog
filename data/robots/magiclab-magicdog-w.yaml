    vaerdi: "ikke_oplyst"
    kilde: "https://www.magiclab.top/en/dog-w"
    hentet: "2026-08-19"
    advarsel: "THREE LABELS, THREE MEANINGS, ONE FIGURE — and that is why the field is left blank. EN: Minimum obstacle clearance height < 60 cm. CN: minimum obstacle-AVOIDANCE distance height < 60 cm — i.e. sensing, not crossing. magiclabglobal.com: Climbs and Drops: Up to 60cm. Had the English label been taken at face value, 60 cm would have landed here, and MagicDog-W would beat the Lynx S10 on a discipline it is not documented for. Note also that the operator < makes the English label self-contradictory: a MINIMUM that is LESS THAN something."
  trappetrin_kontinuerlig:
