    advarsel: "TRE ETIKETTER, TRE BETYDNINGER, ET TAL - og derfor staar feltet tomt. EN: Minimum obstacle clearance height < 60 cm. CN: minimum hindringsUNDVIGELSES-afstandshoejde < 60 cm - altsaa sensorik, ikke forcering. magiclabglobal.com: Climbs and Drops: Up to 60cm. Havde den engelske etiket vaeret taget for paalydende, ville 60 cm vaere landet her, og MagicDog-W ville slaa Lynx S10 paa en disciplin, den ikke er dokumenteret for. Bemaerk ogsaa, at operatoren < goer den engelske etiket selvmodsigende: et MINIMUM, der er MINDRE END noget."
