noter:
  - "SAMME FYSISKE MAAL SOM M1 PRO, IKKE BASISUDGAVEN: staaende maal 930×480×595mm og krybende maal 930×630×210mm - identisk med M1 Pro, 10mm hoejere end basisudgavens 585/200mm. Vaegt 41kg identisk paa tvaers af alle tre varianter."
  - "KAMERAOPSTILLING ER HELT FORSKELLIG FRA BASISUDGAVEN OG M1 PRO, IKKE BLOT EN TILFOEJELSE: M1 Ultra's sensor-sektion skriver \"相机类型: 鱼眼相机 x 4 + 前向双目相机 x 2 环视成像\" (4x fiskeoejekamera + 2x fremadrettet stereokamera, rundtomsynsbilleddannelse) og \"相机像索: 鱼眼300万，双目200万\" (fiskeoeje 3MP, stereo 2MP) - erstatter (ikke supplerer) basisudgavens/M1 Pro's \"广角相机 x 2, 800万 x 2\" (2x bredvinkelkamera, 8MP hver). Sidens broedtekst bekraefter: \"四路鱼眼、前向双目相机 / 铜锤M1 Ultra 支持720° 全景感知，进一步提升深度感知与复杂环境识别能力。\" (Firevejs fiskeoeje, fremadrettet stereokamera - Tongchui M1 Ultra understoetter 720° panoramaopfattelse, forbedrer yderligere dybdeopfattelse og kompleks miljoegenkendelse). M1 Ultra's egen funktionsliste tilfoejer desuden det eksplicitte punkt \"720° 3D 环视感知系统: 支持\" (720° 3D rundtomsyn-opfattelsessystem, understoettet) - IKKE til stede paa hverken basisudgaven eller M1 Pro."
  - "\"自主导航\" (SELVSTAENDIG NAVIGATION) MANGLER HELT I M1 ULTRAS EGEN FUNKTIONSLISTE - EN GENUIN UDELADELSE, IKKE EN ANTAGELSE. Basisudgaven naevner det som tilvalg (\"选配：智航Pro版\"), M1 Pro naevner det som standard (\"智航Pro版\", uden \"选配\"), men M1 Ultras egen funktionsliste (id 508, 11 punkter i alt: AI强化学习运控, 基础动作, 特技动作, 实时图像传输, OTA升级, 二次开发, 目标追踪, 720°3D环视感知系统, 智能避障, 语音对讲, 录音广播) INDEHOLDER INGEN \"自主导航\"-raekke overhovedet. Dette er dokumenteret som fundet i kilden, ikke antaget at vaere en udeladelse eller fejl fra vores side - kan lige saa godt vaere en reel produktforskel (fx at M1 Ultras sensorpakke erstatter den navngivne \"智航Pro\"-navigationsfunktion med noget andet) som en redaktionel forglemmelse paa producentens egen side. autonominiveau-feltet nedenfor gengiver kun det, listen faktisk indeholder."
