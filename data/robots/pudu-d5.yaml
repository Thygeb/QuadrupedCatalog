  note: "Samme saetning staar ordret paa baade den officielle produktside og webbutikken (store.pudurobotics.com/products/pudu-d5)."
noter:
  - "Vigtig uoverensstemmelse fundet ved felt-for-felt-efterproevning: Den generelle markedsfoeringstekst (samme ordlyd paa officiel side og webbutik) skriver \"Easily handles 25 cm steps, 30° climbs, and 45° descents\" - men den variant-specifikke sammenligningstabel paa webbutikken skriver noget andet for D5 alene: \"D5: 25° ascent, 45° descent\" og \"Maximum Step Height D5: 30 cm\". Markedsfoeringstekstens 30°/25cm er faktisk D5-W's tabelvaerdier (30° ascent, 25 cm step), ikke D5's. Felterne haeldning og trappetrin_kontinuerlig herunder bruger tabellen, IKKE markedsfoeringsteksten - se advarsel paa hvert felt."
  - "Fodnote 5 paa den officielle produktside: \"PUDU D5 Series is shipped with dual high-precision 96-line LiDAR as the standard configuration. For specialized applications requiring enhanced perception, a dual 192-line LiDAR upgrade is available upon request.\" Den fremhaevede markedsfoeringstekst (\"Dual 192-line* spherical LiDARs\") beskriver altsaa en betalt opgradering, ikke standardkonfigurationen."
