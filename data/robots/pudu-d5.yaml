noter:
  - "IMPORTANT DISCREPANCY FOUND BY FIELD-BY-FIELD VERIFICATION: the general marketing copy (identical wording on the official page and the webstore) states \"Easily handles 25 cm steps, 30° climbs, and 45° descents\" — but the variant-specific comparison table on the webstore states something different for D5 alone: \"D5: 25° ascent, 45° descent\" and \"Maximum Step Height D5: 30 cm\". The marketing copy’s 30°/25cm are actually D5-W’s table values (30° ascent, 25 cm step), not D5’s. The slope and stair_step_continuous fields below use the table, NOT the marketing copy — see the caveat on each field."
  - "Footnote 5 on the official product page: \"PUDU D5 Series is shipped with dual high-precision 96-line LiDAR as the standard configuration. For specialized applications requiring enhanced perception, a dual 192-line LiDAR upgrade is available upon request.\" The highlighted marketing copy (\"Dual 192-line* spherical LiDARs\") therefore describes a paid upgrade, not the standard configuration."
