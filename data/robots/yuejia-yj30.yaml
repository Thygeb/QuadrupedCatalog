  note: "Første citat er YJ30's egen produktbeskrivelse (samme side). Egen oversættelse: (undervisning/forskning) -> forskning og udvikling; (patrulje/inspektion) -> inspektion; (beredskab/redning) -> forsvar og beredskab. De to øvrige citater er fra sidens delte sektion (samme tre kort står identisk på alle fire YJ30-seriens produktsider): (politipatrulje) -> sikkerhed og overvågning. Et tredje kort (el-inspektion) er udeladt af citatlisten, da det kun gentager inspektion."
  note_ordlyd: "Første citat er YJ30's egen produktbeskrivelse (samme side). Egen oversættelse: 教学科研 (undervisning/forskning) -> forskning og udvikling; 巡逻巡检 (patrulje/inspektion) -> inspektion; 应急救援 (beredskab/redning) -> forsvar og beredskab. De to øvrige citater er fra sidens delte \"行业应用\"-sektion (samme tre kort står identisk på alle fire YJ30-seriens produktsider): \"警用巡逻\" (politipatrulje) -> sikkerhed og overvågning. Et tredje kort \"电力巡检\" (el-inspektion) er udeladt af citatlisten, da det kun gentager inspektion."
