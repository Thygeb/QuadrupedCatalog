  citat:
    - "越甲灵动YJ30系列面向中小型工业场景与科研教育市场，主打\"轻量化、高性能、高性价比\"，聚焦于教学科研、巡逻巡检、应急救援等场景。"
    - "工业、安防巡检领域"
    - "警用巡逻"
  kilde: https://yuejialingdong.com/index.php/yuejiasizuxilie/56.html
  hentet: 2026-08-25
  note: "Foerste citat er YJ30's egen produktbeskrivelse (samme side). Egen oversaettelse: 教学科研 (undervisning/forskning) -> forskning_udvikling; 巡逻巡检 (patrulje/inspektion) -> inspektion; 应急救援 (beredskab/redning) -> forsvar_beredskab. De to oevrige citater er fra sidens delte \"行业应用\"-sektion (samme tre kort staar identisk paa alle fire YJ30-seriens produktsider): \"警用巡逻\" (politipatrulje) -> sikkerhed_overvaagning. Et tredje kort \"电力巡检\" (el-inspektion) er udeladt af citatlisten, da det kun gentager inspektion."
noter:
  - "STOPPROEVE (firbenet): bestaaet. Producentens egen sidenavigation har hovedpunktet \"越甲四足系列\" (Yuejia Quadruped/Four-Legged Series), navlink til /yuejiasizuxilie.html, som YJ30 staar under. https://yuejialingdong.com/index.php/yuejiasizuxilie/56.html, hentet 2026-08-25."
  - "IKKE LEGETOEJ (L11): nej. Pris 78.000 kr (¥78.000) og anvendelser (巡逻巡检/应急救援/电力巡检 - patrulje/beredskab/el-inspektion) placerer produktet i samme industri-/sikkerhedskategori som resten af kataloget."
  - "GENBRUGT EVIDENS: research- og kildeindsamling for Yuejia Lingdong blev udfoert i spor/kand4 (se fund/FUND-kand4.md afsnit 2 og 7). Denne post er foerste gang tallene skrives ind i en YAML-fil; raa HTML genbruges fra media/_kilder/raa-kand4-2026-08-25/yuejialingdong-yj-56-2026-08-25.html (hentet 2026-08-25, samme dag som denne post skrives)."
  - "STANDMAAL-TYPO I KILDEN: raekken skriver \"682×354×462m\" - manglende \"m\" i \"mm\", i modsaetning til alle oevrige raekker i samme tabel (fx YJ30W's \"682×354×532mm\"), inkl. i den engelsksprogede sideversion (samme typo gentaget der: \"682 × 354 × 462m\"). Vurderet som en kildeside-tastefejl, ikke en enhed paa meter - 462 m hoejde ville vaere absurd for en firbenet robot paa 17,5 kg. Enheden er sat til mm."
  - "SINGLE \"负载\"-FELT, IKKE GAAENDE/STAAENDE-SPLITTET: tabellen har KUN én uspecificeret \"负载\" (last)-raekke (10kg), ikke to separate \"静态负载\"/\"动态负载\"-raekker som YJ30Max's tabel har. Samme situation som Unitree Go2 (data/robots/unitree-go2.yaml) - vaerdien er placeret i nyttelast_gaaende som et forsigtigt (IKKE en aflaesning) skoen, jf. samme princip. nyttelast_staaende er ikke_oplyst."
  - "MERGED KOLONNEOVERSKRIFT \"爬坡角度/DOF\": tabellens raa HTML har headeren \"爬坡角度/DOF\" (haeldningsvinkel/frihedsgrader) som ÉN kolonne, men kun ÉN vaerdi (50°) i datarraekken. Da 50° baerer gradtegnet, er det haeldningsvinklen; DOF-tallet er slet ikke udfyldt i kilden. frihedsgrader er derfor ikke_oplyst, ikke gaettet til at vaere det samme tal."
  - "DUAL-BATTERY-DRIFTSTID IKKE BRUGT SOM HOVEDVAERDI: tabellen viser \"1.5-2h\" i selve driftstid-raekken, og separat i samme celle (linjeskift) \"3h (Dual Battery)\" - en tilbehoersafhaengig udvidet konfiguration. Hovedvaerdien er 1,5-2 timer; dual-battery-tallet 3h staar i advarsel, ikke i vaerdi/maks."
  - "LIDAR IKKE UDFYLDT: produktfeature-teksten naevner \"多模态感知矩阵：激光视觉协同\" (multimodal sensormatrix: laser-vision-samspil), som antyder en form for laser/LiDAR - men selve \"基础参数\"-tabellen (den strukturerede specifikationstabel) har INGEN lidar-raekke overhovedet. Feltet er derfor ikke_oplyst, ikke udledt af marketingteksten - samme princip som Genisom L2's haandtering af en tilsvarende uoverensstemmelse mellem prosa og tabel."
