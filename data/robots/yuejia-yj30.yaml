noter:
  - "STANDMÅL-TYPO I KILDEN: rækken skriver \"682×354×462m\" - manglende \"m\" i \"mm\", i modsætning til alle øvrige rækker i samme tabel (fx YJ30W's \"682×354×532mm\"), inkl. i den engelsksprogede sideversion (samme typo gentaget der: \"682 × 354 × 462m\"). Vurderet som en kildeside-tastefejl, ikke en enhed på meter - 462 m højde ville være absurd for en firbenet robot på 17,5 kg. Enheden er sat til mm."
  - "MERGED KOLONNEOVERSKRIFT: tabellens rå HTML har headeren (hældningsvinkel/frihedsgrader) som ÉN kolonne, men kun ÉN værdi (50°) i datarrækken. Da 50° bærer gradtegnet, er det hældningsvinklen; DOF-tallet er slet ikke udfyldt i kilden. frihedsgrader er derfor ikke oplyst, ikke gættet til at være det samme tal."
  - "DUAL-BATTERY-DRIFTSTID IKKE BRUGT SOM HOVEDVÆRDI: tabellen viser \"1.5-2h\" i selve driftstid-rækken, og separat i samme celle (linjeskift) \"3h (Dual Battery)\" - en tilbehørsafhængig udvidet konfiguration. Hovedværdien er 1,5-2 timer; dual-battery-tallet 3h står i advarsel, ikke i værdi/maks."
  - "LIDAR IKKE UDFYLDT: produktfeature-teksten nævner (multimodal sensormatrix: laser-vision-samspil), som antyder en form for laser/LiDAR - men selve tabellen (den strukturerede specifikationstabel) har INGEN lidar-række overhovedet. Feltet er derfor ikke oplyst, ikke udledt af marketingteksten - samme princip som Genisom L2's håndtering af en tilsvarende uoverensstemmelse mellem prosa og tabel."
noter_ordlyd:
  - ""
  - "MERGED KOLONNEOVERSKRIFT \"爬坡角度/DOF\": tabellens rå HTML har headeren \"爬坡角度/DOF\" (hældningsvinkel/frihedsgrader) som ÉN kolonne, men kun ÉN værdi (50°) i datarrækken. Da 50° bærer gradtegnet, er det hældningsvinklen; DOF-tallet er slet ikke udfyldt i kilden. frihedsgrader er derfor ikke oplyst, ikke gættet til at være det samme tal."
  - ""
  - "LIDAR IKKE UDFYLDT: produktfeature-teksten nævner \"多模态感知矩阵：激光视觉协同\" (multimodal sensormatrix: laser-vision-samspil), som antyder en form for laser/LiDAR - men selve \"基础参数\"-tabellen (den strukturerede specifikationstabel) har INGEN lidar-række overhovedet. Feltet er derfor ikke oplyst, ikke udledt af marketingteksten - samme princip som Genisom L2's håndtering af en tilsvarende uoverensstemmelse mellem prosa og tabel."
