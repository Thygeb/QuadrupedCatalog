noter:
  - "The M20 page has three tabs: M20, M20 Pro, and M20S. The mapping was read from the page’s own JavaScript, not guessed."
  - "The only entry in the whole collection where the producer itself prints BOTH step heights, each with its own label: 80 cm single step versus 25 cm continuous stairs. The ratio is 3.2 times. It’s the best external confirmation that the two fields should be kept separate."
