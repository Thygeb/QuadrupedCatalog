    hentet: "2026-08-25"
    kildetype: "sekundaer"
    advarsel: "The manufacturer's (Yufan/Uniubi, GitHub org uniubi-ai) own ROS 2 integration package. The README does not mention the model name 'cyvet' directly, but uniubi-ai's ONLY current robot model is 'cyvet' (confirmed independently in the same organization's uniubi_robot_description repo, which has exactly one robot folder: robots/cyvet/). The repository is a fully documented, working integration — not a TODO-marked plan — with a complete motion-bridge architecture and real topics (/cmd_vel, /odom, /joint_states, /imu/data, /battery_state). Unlike GENISOM L2's roamerx repo (rejected there due to an explicit 'TODO' on the hardware coupling), there is no equivalent caveat in the source itself here."
