anvendelse:
  vaerdi: [industri, sikkerhed_overvaagning, forbruger_uddannelse]
  citat: "灵猫是一个开放的具身智能载具和技术平台，具备多场景适应能力，不但可以用在工业场景解决多领域问题，更是可玩性极高的创客、科研爱好者、极客、玩家的实践载体。作为普通用户，也具备完整陪伴和安全防护功能，支持家用场景智能化交互功能，包括：语音对话、跟随行走、全屋巡逻、远程画面查看，适合科技爱好者、家庭安防、亲子科教等。"
  kilde: https://www.uniubi.com/shop/buy?product=air
  hentet: 2026-08-24
  note: "\"工业场景\" (industrielle scenarier) er omsat til industri. \"家庭安防\" (hjemmesikkerhed/patrulje) er omsat til sikkerhed_overvaagning. \"亲子科教\" (foraelder-barn naturvidenskabsundervisning) er omsat til forbruger_uddannelse. \"创客、科研爱好者、极客、玩家\" (maker/forsker/geek/spiller) er en malgruppebeskrivelse, ikke en branche, og er ikke omsat til nogen kategori."
noter:
  - "STOPPROEVE (firbenet): Producentens egen navigation kalder produktet \"四足机器人\" (firbenet/quadruped-robot), link /embodied-ai/robot. Produktsiden skriver selv om bevaegelsen: \"无论是疾速奔跑、灵活转身，还是复杂的仿生步态，每一个指令都能精准执行\" (\"Uanset om det er lynhurtigt loeb, adroit vending eller kompleks biomimetisk gangart, udfoeres hver kommando praecist\"). Kilde: https://www.uniubi.com/embodied-ai/robot, hentet 2026-08-24."
  - "Produktnavnet staar ordret \"灵猫•Cyvet\" paa koebssiden (shop/buy?product=air) - \"Cyvet\" er altsaa en del af det officielle produktnavn, ikke kun en presseoversaettelse. Firmaets engelske juridiske navn i copyright-linjen er \"Universal Ubiquitous AI Co., Ltd.\", brandmaerket paa sitet er \"UNIUBI AI\", og domaenet er uniubi.com (omdirigeret fra det aeldre uni-ubi.com). Kinesisk navn 宇泛智能/杭州宇泛智能科技 = samme selskab, jf. baike.baidu.com/item/杭州宇泛智能科技有限公司."
  - "VIGTIG FORBEHOLD FRA PRODUCENTEN SELV: koebssidens bundtekst skriver ordret: \"本页参数基于当前工程样机测试结果与版本规划整理，部分功能及性能数据仍在持续开发和优化中。实际量产配置、性能表现及交付内容以订单确认信息和实际发货版本为准.\" (parametrene paa denne side er baseret paa test af det nuvaerende ingenioer-praeproduktionseksemplar og planlagte versioner; nogle funktioner og ydelsestal er stadig under udvikling; det faktiske masseproduktionsudstyr afgoeres af ordrebekraeftelsen). Derfor status: annonceret, ikke i_produktion - specifikationerne er selv markeret som proevemaskine-tal, ikke et endeligt produkt."
  - "Feltet 关节峰值扭旋/额定扭矩 (led-drejningsmoment) har intet felt i skemaet. Noteret her: peak 60 N·m, nominel ca. 18 N·m pr. led (kilde som frihedsgrader nedenfor)."
  - "工作最大功率 (maks. arbejdseffekt) 3500 W har intet felt i skemaet - noteret her, ikke i felter."
  - "INGEN billede:-blok. Billedkandidater fundet men ikke bedoemt med oejne i dette spor - se fund/FUND-kand2.md."
