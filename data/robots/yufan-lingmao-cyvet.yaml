status: "annonceret"
fremdrift: "ben"
noter:
  - "HJEMBY ER IKKE OPLYST AF PRODUCENTEN SELV: otte gemte sider fra producentens eget domæne (forside, produktside, motorside, købsside, to embodied-ai-sider, to download/GitHub-sider) nævner ingen by direkte - kun en Zhejiang-provins-registrering (ICP-koden begynder med, provinsens eget præfiks, ikke en bykode). Den by, der ofte tilskrives selskabet (næste note), står kun i en ekstern encyklopædiopslag, der ikke er gemt her og derfor ikke kan efterprøves som producentens egen kilde."
  - "Produktnavnet står ordret på købssiden (shop/buy?product=air) - \"Cyvet\" er altså en del af det officielle produktnavn, ikke kun en presseoversættelse. Firmaets engelske juridiske navn i copyright-linjen er \"Universal Ubiquitous AI Co., Ltd.\", brandmærket på sitet er \"UNIUBI AI\", og domænet er uniubi.com (omdirigeret fra det ældre uni-ubi.com). Kinesisk navn = samme selskab, jf. baike.baidu.com/item."
  - "VIGTIG FORBEHOLD FRA PRODUCENTEN SELV: købssidens bundtekst skriver ordret: (parametrene på denne side er baseret på test af det nuværende ingeniør-præproduktionseksemplar og planlagte versioner; nogle funktioner og ydelsestal er stadig under udvikling; det faktiske masseproduktionsudstyr afgøres af ordrebekræftelsen). Derfor status: annonceret, ikke i_produktion - specifikationerne er selv markeret som prøvemaskine-tal, ikke et endeligt produkt."
noter_ordlyd:
  - "HJEMBY ER IKKE OPLYST AF PRODUCENTEN SELV: otte gemte sider fra producentens eget domæne (forside, produktside, motorside, købsside, to embodied-ai-sider, to download/GitHub-sider) nævner ingen by direkte - kun en Zhejiang-provins-registrering (ICP-koden begynder med \"浙\", provinsens eget præfiks, ikke en bykode). Den by, der ofte tilskrives selskabet (næste note), står kun i en ekstern encyklopædiopslag, der ikke er gemt her og derfor ikke kan efterprøves som producentens egen kilde."
  - "Produktnavnet står ordret \"灵猫•Cyvet\" på købssiden (shop/buy?product=air) - \"Cyvet\" er altså en del af det officielle produktnavn, ikke kun en presseoversættelse. Firmaets engelske juridiske navn i copyright-linjen er \"Universal Ubiquitous AI Co., Ltd.\", brandmærket på sitet er \"UNIUBI AI\", og domænet er uniubi.com (omdirigeret fra det ældre uni-ubi.com). Kinesisk navn 宇泛智能/杭州宇泛智能科技 = samme selskab, jf. baike.baidu.com/item/杭州宇泛智能科技有限公司."
  - "VIGTIG FORBEHOLD FRA PRODUCENTEN SELV: købssidens bundtekst skriver ordret: \"本页参数基于当前工程样机测试结果与版本规划整理，部分功能及性能数据仍在持续开发和优化中。实际量产配置、性能表现及交付内容以订单确认信息和实际发货版本为准.\" (parametrene på denne side er baseret på test af det nuværende ingeniør-præproduktionseksemplar og planlagte versioner; nogle funktioner og ydelsestal er stadig under udvikling; det faktiske masseproduktionsudstyr afgøres af ordrebekræftelsen). Derfor status: annonceret, ikke i_produktion - specifikationerne er selv markeret som prøvemaskine-tal, ikke et endeligt produkt."
anvendelse:
  vaerdi:
    - "industri"
    - "sikkerhed_overvaagning"
    - "forbruger_uddannelse"
  citat: "Lingmao er en åben platform for embodied-intelligence-køretøjer og teknologi med tilpasningsevne til mange scenarier. Den kan bruges i industrielle scenarier til at løse problemer på tværs af flere fagområder, men er også et yderst legesygt praksisredskab for makere, forskningsentusiaster, geeks og spillere. Som almindelig bruger har den også fuld følgeskabs- og sikkerhedsfunktion og understøtter intelligente interaktionsfunktioner til hjemmebrug, herunder stemmedialog, gå-følge, patrulje i hele hjemmet og fjernvisning af billede - velegnet til teknologientusiaster, hjemmesikkerhed samt forælder-barn naturvidenskabsundervisning m.m."
  citat_ordlyd: "Lingmao er en åben platform for embodied-intelligence-køretøjer og -teknologi med tilpasningsevne til mange scenarier. Den kan bruges i industrielle scenarier til at løse problemer på tværs af flere fagområder, men er også et yderst legesygt praksisredskab for makere, forskningsentusiaster, geeks og spillere. Som almindelig bruger har den også fuld følgeskabs- og sikkerhedsfunktion og understøtter intelligente interaktionsfunktioner til hjemmebrug, herunder stemmedialog, gå-følge, patrulje i hele hjemmet og fjernvisning af billede - velegnet til teknologientusiaster, hjemmesikkerhed samt forælder-barn naturvidenskabsundervisning m.m. (灵猫是一个开放的具身智能载具和技术平台，具备多场景适应能力，不但可以用在工业场景解决多领域问题，更是可玩性极高的创客、科研爱好者、极客、玩家的实践载体。作为普通用户，也具备完整陪伴和安全防护功能，支持家用场景智能化交互功能，包括：语音对话、跟随行走、全屋巡逻、远程画面查看，适合科技爱好者、家庭安防、亲子科教等。)"
  kilde: "https://www.uniubi.com/shop/buy?product=air"
  hentet: "2026-08-24"
  note: "(industrielle scenarier) er omsat til industri. (hjemmesikkerhed/patrulje) er omsat til sikkerhed og overvågning. (forælder-barn naturvidenskabsundervisning) er omsat til forbruger og uddannelse. (maker/forsker/geek/spiller) er en malgruppebeskrivelse, ikke en branche, og er ikke omsat til nogen kategori."
  note_ordlyd: "\"工业场景\" (industrielle scenarier) er omsat til industri. \"家庭安防\" (hjemmesikkerhed/patrulje) er omsat til sikkerhed og overvågning. \"亲子科教\" (forælder-barn naturvidenskabsundervisning) er omsat til forbruger og uddannelse. \"创客、科研爱好者、极客、玩家\" (maker/forsker/geek/spiller) er en malgruppebeskrivelse, ikke en branche, og er ikke omsat til nogen kategori."
