noter:
  - "HJEMBYEN ER JINAN, IKKE BLOT SHANDONG: producentens egen om os-side skriver den fulde adresse \"Software Park Building, No. 1768 Xinluo Street, High tech Zone, Jinan City, Shandong Province\" - Shandong er provinsen, Jinan er den by deri, producenten faktisk oplyser."
  - "ÅBENT PUNKT, IKKE LØST: overskrifterne og beskrivelserne på producentens egen side er uenige om modelnavnene. Overskriften Y20 står over en beskrivelse, der handler om Y30 (og Y10 over en Y5-beskrivelse, e-Dog over en Y15-beskrivelse). Tre ud af tre stemmer ikke. Overskriften er brugt som modelnavn. Posten kan ikke låses, før nogen har spurgt producenten, hvilket navn der gælder."
  - "Specifikationerne står i tabeller på den engelske side, men selve tabellerne er på kinesisk. Markup'en bærer x:str-attributter - tabellerne er indsat fra Excel."
