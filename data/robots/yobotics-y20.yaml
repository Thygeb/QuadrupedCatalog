  - "THE HOME CITY IS JINAN, NOT JUST SHANDONG: the manufacturer's own About page states the full address \"Software Park Building, No. 1768 Xinluo Street, High tech Zone, Jinan City, Shandong Province\" — Shandong is the province, Jinan is the city within it that the manufacturer actually discloses."
  - "OPEN QUESTION, NOT RESOLVED: the headings and the descriptions on the manufacturer's own page disagree about the model names. The heading Y20 sits above a description about Y30 (and Y10 above a Y5 description, e-Dog above a Y15 description). Three out of three do not match. The heading is used as the model name. The entry cannot be locked until someone has asked the manufacturer which name applies."
