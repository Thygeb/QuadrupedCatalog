    kilde: "https://www.unitree.com/aliengo"
    hentet: "2026-08-19"
    advarsel: "The manufacturer states 'Weight (without battery) 21.5kg ±1kg' — the figure is WITHOUT the battery. Checked against all 12 other Unitree models in this catalog: 9 (A2, A2-W, AS2, AS2-W, B1, B2, B2-W, Go2, Go2-W) explicitly label their weight as including the battery; A1 and Laikago do not state a weight at all; only Go1's unlabeled '12 kg' figure does not say either way. So, with that one exception, AlienGo's is the only stated Unitree weight that explicitly excludes the battery. Placed next to Go2's 15 kg and As2's 20 kg — both explicitly with-battery figures — this compares a robot without its battery to two robots with theirs. Tolerance is ±1 kg."
    advarsel_klasse: "gyldighed"
    advarsel_ordlyd: "Weight (without battery) | 21.5kg ±1kg"
