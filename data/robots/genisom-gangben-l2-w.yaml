  kilde: https://www.genisomai.com/product-robot/L2
  hentet: 2026-08-24
  note: "Fra sektionen \"下一个应用场景，它已提前就位\" paa L2's produktside. Teksten staar EN gang paa siden, FOER variant-fanebladet (L2/L2-W/L2-W Ultra) i den strukturerede specifikationstabel - den daekker hele Gangben L2-familien som helhed, ikke kun basisudgaven. Citeret selvstaendigt fra samme URL, IKKE via arvet_fra: det er den samme primaerkilde for alle tre varianter, ikke en slutning om en anden robot (arvet_fra ville forudsaette, at L2-W's EGEN side var tavs og laante L2's citat - det er den ikke, teksten staar paa netop den side, L2-W ogsaa bor paa). Egen oversaettelse: 安防巡逻 -> sikkerhed_overvaagning; 应急消防 (akut brandbekaempelse) -> forsvar_beredskab; 科研教育 -> forskning_udvikling; 短途配送 (kort-distance levering) -> logistik. BEMAERK: dette citat har FIRE led (inkl. 应急消防), mens genisom-gangben-l2.yaml's eksisterende citat kun har tre (mangler 应急消防) - en uafhaengig genlaesning af samme raa HTML for denne post. Den eksisterende L2-post er IKKE rettet, jf. opgavens instruks om ikke at roere de to eksisterende poster."
noter:
  - "MARKETINGKORTETS TAL (70cm forhindringshoejde, 756Wh batteri, 86 TOPS) ER BEVIDST IKKE BRUGT HER: L2-sidens fremhaevede hero-marketingkort (\"70cm 垂直越障高度\", \"756Wh 大容量电池\", \"高达 86 TOPS 算力平台\") staar EN gang for hele siden, foer fanebladene, og er ikke gentaget i L2-W's egen JSON-blok. De matcher L2 (basisudgavens) egne tal noejagtigt - men uden en eksplicit gentagelse i L2-W's egen datablok kan de ikke sikkert tilskrives netop denne variant. forhindring_enkelt, batteri_wh og compute's TOPS-tal staar derfor ikke_oplyst/uden TOPS-tal her, i modsaetning til den eksisterende L2-post, som bruger dem for basisudgaven."
