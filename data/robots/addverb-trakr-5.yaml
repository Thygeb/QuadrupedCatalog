slug: addverb-trakr-5
navn: Trakr 5
producent: Addverb
producentland: Indien
producentby: Noida
status: i_produktion
anvendelse:
  vaerdi: [sikkerhed_overvaagning, forsvar_beredskab, inspektion, industri, forskning_udvikling, forbruger_uddannelse]
  citat: ["Security and Defense", "Remote Inspection", "Construction", "Education and Research"]
  kilde: https://addverb.ai/trakr
  hentet: 2026-08-25
  note: "Fra sektionen \"Industries where we make a difference\" paa Trakr's egen produktside (fem punkter i alt, delt mellem begge varianter - siden skelner ikke mellem Trakr 5 og Trakr 20 i denne sektion). Egen fortolkning af hvert punkt: \"Security and Defense\" -> BEGGE sikkerhed_overvaagning og forsvar_beredskab (eet producentpunkt daekker eksplicit to af skemaets syv kategoriord); \"Remote Inspection\" -> inspektion; \"Construction\" -> industri (skemaet har ingen egen byggekategori); \"Education and Research\" -> BEGGE forskning_udvikling og forbruger_uddannelse. Femte punkt, \"Events and Entertinment\" [sic - stavefejl staar saadan paa siden], er BEVIDST UDELADT fra citat-listen: ingen af skemaets syv kategorier daekker begivenheder/underholdning, og en tvungen kobling ville vaere vores mening, ikke producentens (R16). Blog-siden (addverb.ai/blog/trakr-indias-homegrown-robotic-dog-quadruped, om samme grundmodel, dateret 15. dec. 2025) naevner en overlappende men ikke identisk liste - \"Construction, Oil, Defence, Exploration & Security\" - som bekraefter industri/forsvar_beredskab/sikkerhed_overvaagning, men er ikke brugt som selvstaendigt citat her for ikke at blande to sider."
billede:
  fil: fotos/fabrikant/addverb-trakr-5.png
  ophav: fabrikant
  kilde: https://addverb.ai/trakr
  hentet: 2026-08-26
  alt: "Addverb Trakr, firbenet robot i roedt og graat, studiofoto set fra siden paa hvid baggrund"
  note: "Delt foto med addverb-trakr-20.yaml: samme produktside/fane-vaelger, som ikke har to forskellige produktfotos for Trakr 5 og Trakr 20."
felter:
  egenvaegt:
    vaerdi: 18
    enhed: kg
    kilde: https://addverb.ai/trakr
    hentet: 2026-08-25
    advarsel: "\"WEIGHT (INCL BATTERY): 18 KG\" i den strukturerede specifikationstabel for Trakr 5-fanen."
  laengde: ikke_oplyst
  bredde: ikke_oplyst
  hoejde:
    vaerdi: 280
    enhed: mm
    kilde: https://addverb.ai/trakr
    hentet: 2026-08-25
    advarsel: "\"STANDING HEIGHT: 280 MM\". En separat \"HEIGHT OF CROUCHING: 150 MM\" er ogsaa oplyst; skemaet har intet felt til den tilstand. Laengde og bredde er ikke oplyst noget sted paa siden."
  frihedsgrader:
    vaerdi: 12
    enhed: DoF
    kilde: https://addverb.ai/blog/trakr-indias-homegrown-robotic-dog-quadruped
    hentet: 2026-08-25
    kildetype: sekundaer
    advarsel: "Blogindlaeggets \"12 actuators\", ikke eksplicit \"frihedsgrader\" - samme fortolkning som andre robotter i kataloget, hvor kun ledmotor-/aktuatorantal er oplyst. Tildelt Trakr 5 (ikke Trakr 20), fordi bloggens oevrige tal (90-min drift, 5 kg payload) er identiske med Trakr 5's egen specifikationstabel."
  nyttelast_gaaende:
    vaerdi: 5
    enhed: kg
    kilde: https://addverb.ai/trakr
    hentet: 2026-08-25
    advarsel: "\"PAYLOAD: 5 KG\" - producenten skelner ikke mellem gaaende og staaende last. Placeringen i nyttelast_gaaende er vores tolkning, ikke en aflaesning (samme princip som Boston Dynamics Spot og ANYbotics ANYmal i dette katalog)."
  nyttelast_staaende: ikke_oplyst
  hastighed:
    vaerdi: 1.5
    enhed: m/s
    kilde: https://addverb.ai/trakr
    hentet: 2026-08-25
    advarsel: "\"SPEED: 1.5 M/S\" i specifikationstabellen."
  haeldning:
    vaerdi: 30
    enhed: "°"
    operator: "<="
    kilde: https://addverb.ai/trakr
    hentet: 2026-08-25
    advarsel: "Specifikationstabellen skriver \"MAX CLIMB ANGLE: 30 DEGREES\" uden operator; funktionsbeskrivelsen paa samme side skriver \"Climbs stairs, slopes (≤ 30°)...\". Operatoren er hentet fra funktionsbeskrivelsen, tallet fra begge steder (identisk)."
  forhindring_enkelt: ikke_oplyst
  trappetrin_kontinuerlig:
    vaerdi: 12
    enhed: cm
    kilde: https://addverb.ai/trakr
    hentet: 2026-08-25
    advarsel: "\"MAXIMUM STEP: 120 MM\" i specifikationstabellen (=12 cm). MODSIGES af sidens egen broedtekst for netop Trakr 5: \"Trakr 5 is our agile quadruped robot with 5 kg payload capacity and climb steps upto 170 mm\" (=17 cm) - to forskellige tal for samme evne paa samme side, regel 9: ikke rettet stiltiende. Tabellens tal er brugt som primaer vaerdi. Producenten skelner ikke selv mellem \"enkelt forhindring\" og \"kontinuerlig trappe\" - klassificeret som trappetrin_kontinuerlig ud fra ordlyden (\"step\"/\"climb steps\") og stoerrelsesordenen (12-17 cm ligger paa niveau med andre robotters kontinuerlige trappetal, ikke deres enkelt-forhindringstal paa 40-80 cm). En separat \"MAX CLIMB DROP HEIGHT: 150 MM\" er ogsaa oplyst; skemaet har intet felt til nedstigningshoejde."
  ip_klasse:
    vaerdi: IP67
    kilde: https://addverb.ai/trakr
    hentet: 2026-08-25
    advarsel: "\"INGRESS PROTECTION (IP RATING): IP67 (OPTIONAL)\" - tilvalg, ikke standard paa alle enheder."
  temp_min:
    vaerdi: 5
    enhed: "°C"
    kilde: https://addverb.ai/trakr
    hentet: 2026-08-25
  temp_maks:
    vaerdi: 45
    enhed: "°C"
    kilde: https://addverb.ai/trakr
    hentet: 2026-08-25
    advarsel: "\"TEMPERATURE: +5 °C TO +45 °C\"."
  batteri_wh: ikke_oplyst
  driftstid:
    vaerdi: 1.5
    enhed: t
    ved_last: ikke_oplyst
    kilde: https://addverb.ai/trakr
    hentet: 2026-08-25
    advarsel: "\"ENDURANCE: 1.5 HRS\" i specifikationstabellen, bekraeftet af blogindlaeggets gentagne \"90-minute runtime\" (=1,5 t). Ingen lastbetingelse oplyst - ved_last ikke_oplyst, selvom et separat 5 kg-payloadtal findes andetsteds paa siden (regel 8: gaetter ikke paa koblingen). VOLTAGE 24V og BATTERY CAPACITY 10AH er ogsaa oplyst; Wh er ikke trykt direkte og udregnes ikke af V x Ah (regel 9-praecedens fra flere andre poster i kataloget)."
  hot_swap: ikke_oplyst
  ladetid:
    vaerdi: 1.5
    enhed: t
    kilde: https://addverb.ai/trakr
    hentet: 2026-08-25
    advarsel: "\"CHARGING TIME: 90 MINS\" (=1,5 t) - samme talvaerdi som ENDURANCE, tilsyneladende en tilfaeldighed, ikke rettet. Charger: 24V, 10A er ogsaa oplyst; intet skemafelt til input-effekt."
  dockingstation:
    vaerdi: ja
    kilde: https://addverb.ai/trakr
    hentet: 2026-08-25
    advarsel: "\"CHARGING PILE COMPATIBILITY: YES\" - kompatibel med ladestation/-sokkel. En separat \"AUTONOMOUS CHARGING: OPTIONAL\" findes ogsaa; selve dockingkompatibiliteten er ikke maerket som tilvalg, saa \"ja\" er brugt uden operator."
  lidar:
    vaerdi: "3D LiDAR (type og model ikke oplyst)"
    kilde: https://addverb.ai/trakr
    hentet: 2026-08-25
    advarsel: "\"LIDAR: 3D LIDAR\" i Trakr 5-fanens egen sensor-sektion (ikke kun i den delte \"Add-On Features\"-liste, som er tilvalg for hele Trakr-linjen)."
  kameraer:
    vaerdi: "HD bredvinkelkamera (antal, opløsning og model ikke oplyst)"
    kilde: https://addverb.ai/trakr
    hentet: 2026-08-25
    advarsel: "\"HD WIDE ANGLE CAMERA: YES\" i Trakr 5-fanens egen sensor-sektion. Blogindlaegget (om samme grundmodel, en anden side) beskriver i stedet \"four stereo cameras\" - en anden kameraopstilling end den nuvaerende produktsides \"HD wide angle camera\". De to sider er ikke forsonet stiltiende; kun den nuvaerende produktsides ordlyd er brugt som feltvaerdi."
  compute:
    vaerdi: "I7-processor (grundlaeggende); NVIDIA Jetson Orin (tilvalgt modul til hoej beregningskraft)"
    kilde: https://addverb.ai/trakr
    hentet: 2026-08-25
    advarsel: "\"BASIC COMPUTING POWER: I7 PROCESSOR\" og \"HIGH COMPUTING POWER MODULE: JETSON ORIN\"."
  ros2: ikke_oplyst
  sdk_sprog: ikke_oplyst
  autonominiveau:
    vaerdi: "Fuldt autonome missioner med minimal overvaagning: selvopladning, programmerbare patruljeruter/inspektionspunkter, tillaegssensorer til specifikke opgaver (\"Fully Autonomous Missions\"); Model Predictive Control (MPC) og Reinforcement Learning (RL) til stabilitet og gangartstilpasning (\"Dynamic Locomotion\"); intelligent objektdetektion og undvigelse (\"INTELLIGENT DETECTION & AVOIDANCE: YES\"); manuel joystick-styring tilgaengelig som tilvalg"
    kilde: https://addverb.ai/trakr
    hentet: 2026-08-25
    advarsel: "Sammensat af flere afsnit paa siden: de fire funktionskort foer fane-vaelgeren (gaelder hele Trakr-linjen, ikke fane-specifikt) samt \"OPTIONAL FEATURES & MODULES\"-raekken i Trakr 5's egen tabel. Ingen navngivet autonominiveau-skala."
  monteringsinterface: ikke_oplyst
  stroem_ud: ikke_oplyst
  dataporte: ikke_oplyst
  pris: ikke_oplyst
  ce_oplyst: ikke_oplyst
