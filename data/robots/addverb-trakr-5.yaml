    vaerdi: 12
    enhed: "cm"
    kilde: "https://addverb.ai/trakr"
    hentet: "2026-08-25"
    advarsel: "From the specification table (=12 cm). CONTRADICTED by the page’s own body text for Trakr 5 specifically: \"Trakr 5 is our agile quadruped robot with 5 kg payload capacity and climb steps upto 170 mm\" (=17 cm) - two different figures for the same capability on the same page, not silently reconciled (rule 9). The table’s figure is used as the primary value. The manufacturer does not itself distinguish \"single obstacle\" from \"continuous stairs\" - classified as continuous stair-climbing based on the wording (\"step\"/\"climb steps\") and the order of magnitude (12-17 cm is in line with other robots’ continuous-stair figures, not their single-obstacle figures of 40-80 cm). A separate descent figure is also given (\"MAX CLIMB DROP HEIGHT: 150 MM\"); the schema has no field for descent height."
    advarsel_klasse: "gyldighed"
    advarsel_ordlyd: "MAXIMUM STEP: 120 MM"
