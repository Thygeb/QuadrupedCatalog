    vaerdi: 2.4
    enhed: "m/s"
    enhed_imperial: "mph"
    vaerdi_imperial: 4.9
    kilde: "https://www.ghostrobotics.io/vision-60"
    hentet: "2026-08-19"
    advarsel: "TWO ERRORS IN ONE FIELD, both on the manufacturer's own page (see caveat_wording). (1) The bullet list at the top of the product page states 'up to 2.5 meters/second (5.6 miles/hour)'; the specification table further down the SAME page states 2.4 m/s as sprint. (2) The pair 2.4m/s (4.9 mph) does not check out: 2.4 m/s = 5.37 mph, and 4.9 mph = 2.19 m/s. All other pairs on the line are correct (0.9 = 2.01; 1.2 = 2.68; 3.0 = 6.71). Only the sprint pair is wrong, and the error appears on both the product page and the datasheet. Standard walk is 0.9 m/s (2 mph), fast-walk 1.2 m/s."
    advarsel_klasse: "gyldighed"
    advarsel_ordlyd: "Speed: up to 2.5 meters/second (5.6 miles/hour) | 2.4m/s (4.9 mph; working towards 3.0m/s 6.7 mph) sprint"
