    hentet: 2026-08-19
    advarsel: "Producenten trykker 45Ah (2400Wh), Voltage 54V. 45 x 54 = 2430 Wh, ikke 2400 - en afvigelse paa 30 Wh (1,2 %). Vi gengiver det trykte tal og noterer uoverensstemmelsen. Bemaerk: hverken Y1's eller Unitree B2's Wh-tal passer til deres eget Ah x V."
