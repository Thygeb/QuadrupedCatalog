anvendelse:
  vaerdi: [industri, inspektion, forsvar_beredskab]
  citat:
    - "MagicDog Y1 is an industrial quadruped robot engineered for inspection, emergency response, rescue support and demanding outdoor operations."
    - "MagicLab Industrial Quadruped Robot"
  kilde: https://www.magiclabglobal.com/products/magicdog-y1/
  hentet: 2026-08-19
  note: "De to producentdomaener siger det samme: magiclab.top skriver \"MagicLab Industrial Quadruped Robot\" (CN: \"魔法原子工业四足机器人\")."
noter:
  - "Eneste MagicLab-model, hvor alle tre producentkilder (magiclab.top EN, magiclab.top CN og magiclabglobal.com) er indbyrdes konsistente. EN og CN er enige om hvert eneste tal."
  - "DOKUMENTERET SAMMENFALD MED UNITREE B2, uden forklaring. Sensorstrengen er samme konstruktion med samme antal og samme forbehold; batteriet oplyses i samme form med samme 45 Ah; driftstidsintervallet 4-6 t er identisk; og lastbetingelsen >4 t ved 20 kg er identisk ned til operatoren. Men Y1's hastighed er LAVERE (6 m/s mod B2's > 6 m/s), maalene er blandede, og paa det eneste sammenlignelige trinfelt oplyser B2 et tal og Y1 intet. Vi paastaar ingenting om aarsagen."
