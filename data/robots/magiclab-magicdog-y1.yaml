noter:
  - "HOME CITY IS SUZHOU, NOT WUJIANG: the manufacturer’s global site states directly \"Founded in 2024 and headquartered in Suzhou\" and repeats \"Founded in Suzhou, China\". The string \"Wujiang\", which the record previously carried alongside Suzhou, appears 0 times across the company’s archived pages."
  - "ONLY MagicLab MODEL WHERE ALL THREE MANUFACTURER SOURCES (magiclab.top EN, magiclab.top CN and magiclabglobal.com) ARE MUTUALLY CONSISTENT. EN and CN agree on every single figure."
  - "DOCUMENTED OVERLAP WITH UNITREE B2, WITHOUT EXPLANATION. The sensor string is the same construction with the same count and the same caveat; the battery is stated in the same form with the same 45 Ah; the runtime interval 4-6 h is identical; and the load condition >4 h at 20 kg is identical down to the operator. But Y1’s speed is LOWER (6 m/s vs. B2’s > 6 m/s), the dimensions are mixed, and on the only comparable step field B2 states a figure and Y1 states none. We make no claim about the cause."
