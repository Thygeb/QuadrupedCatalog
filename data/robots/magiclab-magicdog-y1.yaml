noter:
  - "HJEMBYEN ER SUZHOU, IKKE WUJIANG: producentens globale site skriver direkte \"Founded in 2024 and headquartered in Suzhou\" og gentager \"Founded in Suzhou, China\". Strengen \"Wujiang\", som posten tidligere bår ved siden af Suzhou, findes 0 gange i selskabets gemte sider."
  - "Eneste MagicLab-model, hvor alle tre producentkilder (magiclab.top EN, magiclab.top CN og magiclabglobal.com) er indbyrdes konsistente. EN og CN er enige om hvert eneste tal."
  - "DOKUMENTERET SAMMENFALD MED UNITREE B2, uden forklaring. Sensorstrengen er samme konstruktion med samme antal og samme forbehold; batteriet oplyses i samme form med samme 45 Ah; driftstidsintervallet 4-6 t er identisk; og lastbetingelsen >4 t ved 20 kg er identisk ned til operatoren. Men Y1's hastighed er LAVERE (6 m/s mod B2's > 6 m/s), målene er blandede, og på det eneste sammenlignelige trinfelt oplyser B2 et tal og Y1 intet. Vi påstår ingenting om årsagen."
