noter:
  - "REELT PRODUKT, IKKE KUN RENDERING: manualen har fulde tekniske specifikationstabeller med tal og enheder for alle seks modeller, ikke kun marketingtekst - samme standard som resten af kataloget."
  - "HOT_SWAP FRA DEN DELTE FUNKTIONSSIDE (side 6), IKKE FRA C1's EGEN TABEL: manualens fælles funktionsbeskrivelse (før variant-opdelingen) skriver \"智能仿生四足机器人采用'自主充电+手动换电'双模能源管理系统...同时配备模块化热插拔电池仓，支持数秒完成电池更换\" (dual-mode: autonom opladning + manuel batteriskift; modulært hot-swap-batterirum, batteriskift på få sekunder). Dette er IKKE gentaget i C1's egen tekniske parametertabel (som kun har en \"自主充电功能: 支持\"-række, ingen hot-swap-række) - samme forsigtighedsprincip som anvendelse-feltet: citeret uafhængigt fra familiesiden, ikke fra en model-specifik tabelrække."
  - "DOCKINGSTATION KOMBINERER TO KILDER: den model-specifikke tabellens \"自主充电功能: 支持\" (autonom opladningsfunktion: understøttet) OG den delte funktionssides \"通过激光雷达导航实现自动对接充电桩\" (via lidar-navigation, automatisk docking med ladestation) - de to bekræfter hinanden."
anvendelse:
  vaerdi:
    - "sikkerhed_overvaagning"
    - "forsvar_beredskab"
    - "inspektion"
  citat:
    - "Sikkerhedspatrulje i offentlige rum som lufthavne, togstationer og boligområder (机场/车站/社区等公共场所安保巡逻)"
    - "Rekognoscering og eftersøgning ved katastrofer som jordskælv, ruiner og diger (地震/废墟/河堤等灾害应急救援侦查搜索)"
    - "Patrulje ved grænser eller særlige områder, vagtposter samt undersøgelse ved bevæbnet antiterror, sprængstofrydning og andre akutte hændelser (边境或特殊区域治安巡逻、岗哨及武装反恐、防爆等突发事件勘察)"
    - "Sikkerhedsinspektion i fabrikker, industriparker og havne (工厂/园区/港口等场景安防巡检)"
    - "Intelligent inspektion og dataindsamling af højrisiko industrielt udstyr (高风险工业设备智能巡检与数据采集)"
    - "Intelligent inspektion af giftige industriområder og andre prioriterede zoner (工业有毒及重点区域的智能巡检)"
