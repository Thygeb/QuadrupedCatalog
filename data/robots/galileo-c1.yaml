  note: "From the manual's page 4, BEFORE the model-specific technical parameter tables (pages 7-9). The text appears under the heading (the generic family name, the same name C1 itself carries) and does not name C1 specifically - it covers the whole C1/E1/S1 series as a product category. Our own translation: (security patrol) -> security and surveillance; (emergency response/anti-terror/explosive clearance) -> defense and emergency response; (security/intelligent inspection) -> inspection. The same quote is used independently on all six Galileo entries (C1/C1-W/E1/E1-W/S1/S1-W), NOT via inherited_from, because it is the family page that precedes the variant split - same principle as GENISOM Gangben L2-W's note about citing the shared source independently."
  note_ordlyd: "From the manual's page 4 (\"应用场景\"), BEFORE the model-specific technical parameter tables (pages 7-9). The text appears under the heading \"智能仿生四足机器人\" (the generic family name, the same name C1 itself carries) and does not name C1 specifically - it covers the whole C1/E1/S1 series as a product category. Our own translation: 安保巡逻 (security patrol) -> security and surveillance; 应急救援/武装反恐/防爆 (emergency response/anti-terror/explosive clearance) -> defense and emergency response; 安防巡检/智能巡检 (security/intelligent inspection) -> inspection. The same quote is used independently on all six Galileo entries (C1/C1-W/E1/E1-W/S1/S1-W), NOT via inherited_from, because it is the family page that precedes the variant split - same principle as GENISOM Gangben L2-W's note about citing the shared source independently."
