  kildetype: "sekundaer"
  note: "Fra manualens side 4 (\"应用场景\"), FØR de model-specifikke tekniske parameter-tabeller (side 7-9). Teksten står under overskriften \"智能仿生四足机器人\" (det generiske familienavn, samme navn C1 selv bærer) og nævner ikke C1 ved navn specifikt - den dækker hele C1/E1/S1-serien som produktkategori. Egen oversættelse: 安保巡逻 (sikkerhedspatrulje) -> sikkerhed og overvågning; 应急救援/武装反恐/防爆 (beredskab/antiterror/sprængstofrydning) -> forsvar og beredskab; 安防巡检/智能巡检 (sikkerheds-/intelligent inspektion) -> inspektion. Samme citat er brugt uafhængigt på alle seks Galileo-poster (C1/C1-W/E1/E1-W/S1/S1-W), IKKE via arvet_fra, fordi det er familiesiden, der ligger før variant-opdelingen - samme princip som Genisom Gangben L2-W's note om at citere den delte kilde selvstændigt."
