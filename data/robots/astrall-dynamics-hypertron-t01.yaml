  sdk_sprog: "ikke_oplyst"
  autonominiveau:
    vaerdi: "\"我们利用高精度激光雷达构建实时构建高程图，使机器狗能'读懂'地形，从而在复杂环境中实现厘米级自主导航、稳定越障与自适应运动\" (centimeter-præcis autonom navigation, stabil forhindringsforcering og adaptiv bevægelse via realtids højdekort fra LiDAR). Sprogets sproglige klasse (SAE/ISO-niveau) er ikke oplyst - kun en kvalitativ beskrivelse."
