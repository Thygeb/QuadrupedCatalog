  note: "Mapning af de otte menupunkter til de syv tilladte værdier: 电力能源 (elkraft/energi), 建筑管廊 (bygge/forsyningstunneler), 矿井轨道 (mine/skinner) og 水利水务 (vandforsyning) er alle industrielle infrastruktursektorer -> industri. 消防应急 (brand/beredskab) -> forsvar og beredskab. 园区厂区 (industripark-/fabriksområde-patrulje - siden skriver selv \"360°全方位监测\", helområde-overvågning) og 警务安防 (politi/sikkerhed) -> sikkerhed og overvågning. 石油化工 (petrokemi) -> industri. Ingen af de otte er oversat til logistik, inspektion, forskning og udvikling eller forbruger og uddannelse."
