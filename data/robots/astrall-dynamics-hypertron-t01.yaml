anvendelse:
  vaerdi: [industri, forsvar_beredskab, sikkerhed_overvaagning]
  citat: "电力能源、消防应急、园区厂区、建筑管廊、矿井轨道、石油化工、警务安防、水利水务 (menupunkterne under \"行业应用\" paa forsiden og produktsiden)"
  kilde: https://www.astralldynamics.com/project-Hypertron-T01.html
  hentet: 2026-08-24
  note: "Mapning af de otte menupunkter til de syv tilladte vaerdier: 电力能源 (elkraft/energi), 建筑管廊 (bygge/forsyningstunneler), 矿井轨道 (mine/skinner) og 水利水务 (vandforsyning) er alle industrielle infrastruktursektorer -> industri. 消防应急 (brand/beredskab) -> forsvar_beredskab. 园区厂区 (industripark-/fabriksomraade-patrulje - siden skriver selv \"360°全方位监测\", helomraade-overvaagning) og 警务安防 (politi/sikkerhed) -> sikkerhed_overvaagning. 石油化工 (petrokemi) -> industri. Ingen af de otte er oversat til logistik, inspektion, forskning_udvikling eller forbruger_uddannelse."
noter:
  - "STOPPROEVE (firbenet/hjul-ben-hybrid): Produktsiden kalder maskinen entydigt \"重负载行业级轮足机器狗\" (tunglast industri-klasse hjul-fod-robothund) og \"重载四足机器人平台\" (tunglast firbenet robotplatform) med \"轮足式设计结构\" (hjul-fod-designstruktur). Kilde: https://www.astralldynamics.com/project-Hypertron-T01.html, hentet 2026-08-24. Det er en hjul-ben-hybrid, som opgavebrevet eksplicit taeller som firbenet."
  - "Selskabets kinesiske navn er 深圳璇玑动力科技(有限公司), forkortet 璇玑动力 (Xuanji Power/Dynamics). Det engelske brand paa selskabets egen side er \"ASTRALL\"/\"Astrall Dynamics\" (om-os-siden: \"深圳璇玑动力科技（以下简称：璇玑动力）\"; footer: \"深圳璇玑动力科技有限公司\"; e-mail contact@astralldynamics.com). Producentfeltet her bruger det engelske selvvalgte navn, samme princip som MagicLab/魔法原子."
  - "SITE-INKONSISTENS FUNDET, IKKE BRUGT: forsidens 'hero'-boks paa produktsiden viser fire store tal - 100 km/h, 50 km raekkevidde, 300 kg last, 50 N·m moment - under overskriften \"A01全地形机器人\" (et ANDET modelnavn end \"Hypertron-T01\"). Billedfilerne bag boksen hedder ordret a01-shoux1.png / a01-shoux-hexin.png. Disse tal MODSIGER den detaljerede 产品参数-tabel laengere nede paa samme side (maks. hastighed 7 m/s, maks. staaende last 200 kg, moment 50/300 N·m raekkefolge byttet om). Vurderet som skabelontekst/billede genbrugt fra en anden/generisk produktside og ikke som Hypertron-T01's egne tal - derfor IKKE brugt i felterne nedenfor. Baade hero-tallene og filnavnene er gemt i media/_kilder/raa-kand2-2026-08-24/ til efterproevning."
  - "\"俯卧尺寸（长×宽×高）1130mm*755mm*320mm\" (liggende maal) er ogsaa oplyst, men skemaet har ingen felter til foldemaal (L30) - noteret her i stedet for hoejde-feltet."
  - "驱动&电机: encoder \"双编码器\" og moment \"额定/最大扭矩: 50 N·m / 300 N·m\" har intet felt i skemaet - der findes intet ledmoment-felt. Noteret her."
  - "储存温度 (opbevaringstemperatur, adskilt fra arbejdstemperatur): -20℃~60℃. Skemaets temp_min/temp_maks er arbejdstemperatur (工作温度); opbevaringstemperaturen har intet eget felt."
  - "En engelsk pressemeddelelse (GlobeNewswire, 2026-06-07, \"Astrall Dynamics Unveils Integrated Quadruped Firefighting Robot Hypertron-T01 at INTERSCHUTZ 2026\") naevner i WebSearch-uddrag IP67 (mod IP66 paa den kinesiske produktside) samt en integreret 20L/s brandkanon med 60 m raekkevidde. Denne kilde kunne IKKE hentes direkte (WebFetch og curl gav begge timeout mod globenewswire.com efter flere forsoeg) og er derfor IKKE brugt til noget feltvaerdi - kun noteret her som en ueftereproevet selvmodsigelse (IP66 vs. IP67), der boer afklares naeste gang siden er tilgaengelig."
  - "PDF-OPFYLDNINGSRUNDEN (2026-08-25): fem arkiverede Astrall Dynamics-nyhedsartikler blev laest fuldt til. Ingen af dem handler om Hypertron-T01's egne specifikationer - de daekker firmaets generelle motor-/ledmodulteknologi (轴向磁通电机/aksial-flux-motor), et nyt billedoverfoerings-fjernbetjeningssystem vist paa to droneremesser, og en investeringsrunde (兰璞创投). IP66/IP67-modsigelsen forbliver derfor UAFKLARET - GlobeNewswire-pressemeddelelsen, som naevner IP67, kunne stadig ikke hentes. Ingen af de ti tilbageværende ikke_oplyst-felter (frihedsgrader, batteri_wh, hot_swap, ladetid, compute, ros2, sdk_sprog, monteringsinterface, pris, ce_oplyst) kunne fyldes fra dette materiale."
