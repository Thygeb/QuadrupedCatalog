  kilde: "https://www.astralldynamics.com/project-Hypertron-T01.html"
  hentet: "2026-08-24"
  note: "Mapping of the eight menu items to the seven allowed values: electric power/energy, construction/utility tunnels, mining/rail and water supply are all industrial infrastructure sectors -> industrial. fire/emergency response -> defense and emergency response. industrial-park/factory-area patrol (the page itself says whole-area surveillance) and police/security -> security and surveillance. petrochemical -> industrial. None of the eight map to logistics, inspection, research and development, or consumer and education."
  note_ordlyd: "Mapping of the eight menu items to the seven allowed values: 电力能源 (electric power/energy), 建筑管廊 (construction/utility tunnels), 矿井轨道 (mining/rail) and 水利水务 (water supply) are all industrial infrastructure sectors -> industrial. 消防应急 (fire/emergency response) -> defense and emergency response. 园区厂区 (industrial-park/factory-area patrol - the page itself says \"360-degree all-round monitoring\", whole-area surveillance) and 警务安防 (police/security) -> security and surveillance. 石油化工 (petrochemical) -> industrial. None of the eight map to logistics, inspection, research and development, or consumer and education."
