    vaerdi: "2x mekanisk LiDAR, 192 linjer, rækkevidde ca. 30m ± 10%, punktsky op til 1.720.000 pts/s (dobbelt-echo) / 860.000 pts/s (enkelt-echo), synsfelt 360°x90°, 10 Hz opdatering"
