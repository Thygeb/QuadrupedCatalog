  - "Four variants in tabs on the same product page. Payload falls as equipment is added: 5 - 4.5 - 4 - 2.5 kg. The producer subtracts the sensor weight from the payload. On the field most used for filtering, the four variants are four different robots with a spread of a factor of 2."
