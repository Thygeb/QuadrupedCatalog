  - "KILDETYPE SEKUNDAER (L33) og GENBRUGT EVIDENS: se galileo-c1.yaml."
  - "SIDELAYOUT-AFVIGELSE VED UDTRAEK og TILDELING AF VAERDIBLOK: se galileo-e1.yaml's topnoter for den fulde begrundelse - samme problematik gaelder her. Blokken med \"正向高度差1m高台\" (platform-hoejde-formulering, samme moenster som C1-W) er tildelt E1-W."
  - "TABEL-TERMINOLOGI FOR KLATREEVNE: \"可攀爬高度: 正向高度差1m高台\" -> forhindring_enkelt (100cm), IKKE trappetrin_kontinuerlig - samme moenster som C1-W."
  - "DRIFTSTID UDEN LASTBETINGELSE: \"续航时间: 1.5h～3h\" har intet kg-tal."
  - "STROEM_UD-VAERDIEN ER EN ANALOGISLUTNING: se galileo-e1.yaml's stroem_ud-advarsel - \"5V；12V；48V\" er brugt for baade E1 og E1-W, da vaerdien kun optraadte ÉN gang i det udtrukne tekstlag."
  - "HOT_SWAP OG DOCKINGSTATION: samme kilde og begrundelse som C1."
