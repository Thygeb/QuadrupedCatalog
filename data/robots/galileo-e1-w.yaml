noter:
  - "STOPPROEVE (hjul-ben-hybrid, ikke ren hjulplatform): bestaaet, MED forbehold. Producentens egen model-tabel-overskrift: \"【E1-W工业中型】智能仿生轮足机器人\" (E1-W mellemstor industrimodel - intelligent bionisk HJUL-BEN-robot). Samme moenster som C1/C1-W."
