slug: unitree-laikago
navn: Laikago
producent: Unitree Robotics
producentland: Kina
status: udgaaet
anvendelse:
  vaerdi: ikke_oplyst
  kilde: https://www.unitree.com/laikago
  hentet: 2026-08-21
  note: "PRODUCENTEN HAR INGEN SIDE OM MODELLEN. Uden en produktside er der ingen positionering at citere, og Unitrees to navigationsgrupper (Robot - Consumer/Education og Robot - Industry) naevner ikke Laikago. Samme situation som Ghost Robotics Spirit 40."
foerste_udgivelse: 2017
noter:
  - "MODELLEN ER TAGET AF PRODUCENTENS SITE. Maalt 2026-08-21: https://www.unitree.com/laikago svarer HTTP 404 (gemt, 4.605 bytes), det samme goer /LaikaGo og /cn/laikago. Producentens forside blev hentet samme dag og gennemsoegt: 0 forekomster af strengen laikago, og navigationens 23 produktlinks (A1, A2, As2, aliengo, b1, b2, g1, go1, go2, h1, H2, R1, L2, z1, Dex-serien m.fl.) indeholder ikke modellen. STATUS UDGAAET ER EN KATALOGBESLUTNING PAA DE TO MAALINGER, ikke en erklaering fra Unitree - de har ikke selv sagt, at modellen er udgaaet."
  - "PRODUCENTEN BEKRAEFTER, AT MODELLEN HAR EKSISTERET. Unitrees About-side, tidslinjen for 2017: In September 2017, the reconstructed quadruped robot Laikago came out (taken from the space dog Laika). Derfra kommer foerste_udgivelse 2017. Samme tidslinje naevner Laikago Pro under 2019 i en salgstalsopgoerelse - der findes altsaa mindst to varianter, men ingen af dem har en side."
  - "NUL FELTER INDSAMLET, OG DET ER MED VILJE. Der findes specifikationer for Laikago i tredjepartsdatabaser og hos forhandlere. De er ikke hentet, fordi de ikke kan dateres mod producenten og ville give posten en falsk friskhed. Samme afgoerelse som paa Spirit 40."
  - "HVORFOR POSTEN ALLIGEVEL FINDES: en oversigt, der kun viser de modeller producenten stadig markedsfoerer, fortaeller ikke en indkoeber, at Unitree har bygget firbenede robotter siden 2017, og hvilke der ikke laengere findes. Posten er en daekningsoplysning, ikke en katalogpost."
