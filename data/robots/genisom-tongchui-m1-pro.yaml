anvendelse:
  vaerdi: [forsvar_beredskab, inspektion, sikkerhed_overvaagning, logistik]
  citat: ["森林消防", "石化消防", "电力巡检", "园区巡逻", "物流运输"]
  kilde: https://www.genisomai.com/product-robot/M1
  hentet: 2026-08-25
  note: "Fra sektionen \"下一个应用场景，它已提前就位\" (naeste anvendelsesscenarie, allerede klar) paa M1's egen produktside. Teksten staar EN gang paa siden, delt af alle tre faner (M1/M1 Pro/M1 Ultra) i den strukturerede specifikationstabel - den daekker hele Tongchui M1-familien som helhed. Citeret selvstaendigt fra samme URL, IKKE via arvet_fra: det er den samme primaerkilde for alle tre varianter, ikke en slutning laant fra en anden robots side (samme princip som GENISOM Gangben L2-W/L2-W Ultra i dette katalog - arvet_fra ville forudsaette, at M1 Pro's EGEN side var tavs og laante M1's citat, hvilket den ikke er: teksten staar paa netop den side, M1 Pro ogsaa bor paa). Egen oversaettelse - identisk med genisom-tongchui-m1.yaml's: 森林消防 (skovbrandbekaempelse) -> forsvar_beredskab; 石化消防 (petrokemisk brandbekaempelse) -> forsvar_beredskab; 电力巡检 (elkraftinspektion) -> inspektion; 园区巡逻 (omraadepatrulje) -> sikkerhed_overvaagning; 物流运输 (logistiktransport) -> logistik."
noter:
  - "AUTONOM NAVIGATION ER STANDARD, IKKE TILVALG, PAA M1 PRO: basisudgavens funktionsliste skriver \"自主导航: 选配：智航Pro版\" (selvstaendig navigation: TILVALG). M1 Pro's egen funktionsliste for SAMME punkt skriver blot \"自主导航: 智航Pro版\" - UDEN \"选配\" (tilvalg)-praefikset. Laest som en reel forskel, ikke en udeladelse: M1 Pro leveres med selvstaendig navigation som standardfunktion."
