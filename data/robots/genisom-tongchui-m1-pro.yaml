  autonominiveau:
    vaerdi: "AI强化学习运控 (标配); 基础动作 (踏步/滑行/匍匐等姿态, 前后左右直线移动, 原地旋转, 膝关节姿态变换, 支持砂石路/柏油路/草地/沙地/森林地面/建筑废墟等路面); 特技动作 (爬高墙/过挡鼠板/过窄墙/扭一扭等); 实时图像传输; OTA升级; 二次开发支持; 目标追踪 (UWB跟随；激光视觉跟随); 自主导航 (智航Pro版: 建图/定位/导航/避障 - standard, IKKE mærket tilvalg for denne variant); 智能避障; 语音对讲 (支持); 录音广播 (支持)"
