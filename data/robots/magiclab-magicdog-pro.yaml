noter:
  - "HJEMBYEN ER SUZHOU, IKKE WUJIANG: producentens globale site skriver direkte \"Founded in 2024 and headquartered in Suzhou\" og gentager \"Founded in Suzhou, China\". Strengen \"Wujiang\", som posten tidligere bår ved siden af Suzhou, findes 0 gange i selskabets gemte sider."
  - "TO PRODUCENTSITES, DER MODSIGER HINANDEN. magiclab.top og det nye magiclabglobal.com er begge i luften, begge producentens egne, og de er ikke enige om vægt, forhindringshøjde, frihedsgrader, driftstid og hastighed. Kilden her er magiclab.top; det globale sites afvigende tal står i advarslerne. Hvilket site der er primærkilde, er ikke indsamlerens beslutning."
  - "PRO og EDU deler 41 af 43 tabelrækker. Den eneste specifikationsforskel er SDK-adgang - og fortegnet er kontraintuitivt: EDU har SDK'et, PRO har det ikke."
