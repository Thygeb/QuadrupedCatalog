noter:
  - "NUL PUBLICEREDE SPECIFIKATIONER. Den synlige del af produktsiden består udelukkende af navigation, sidehoved og sidefod. Modelnavnene E300 og E400L er ikke synlige på siden overhovedet; de står på producentens katalogside sammen med underteksten Enterprise Version Available."
  - "SPECIFIKATIONERNE FINDES I FILEN, MEN ER TAGET NED. De ligger inde i en HTML-KOMMENTAR - byte 19.561 til 53.141, 33.580 bytes. Målt: sidens krop er 73.121 tegn med kommentarer og 37.734 uden, altså 48 % af kroppen kommenteret ud. Inde i kommentaren ligger et komplet specifikationsark for begge modeller."
  - "INTET AF DET ER FØRT IND SOM DATA, OG DET BØR INGEN GØRE. Kontrolleret: siden indeholder ingen innerHTML, ingen COMMENT_NODE og ingen kode, der genindsætter blokken. En browser viser intet af det. At hente tal ud af en tilbagetrukket blok ville være at udgive noget, producenten har taget ned, med producentens navn på."
  - "Forskellen betyder noget for en indkøber: det er ikke en producent, der aldrig har oplyst noget. Det er en producent, der HAR oplyst det og derefter skjult det."
