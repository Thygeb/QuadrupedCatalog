  note: "DER STÅR EN POSITIONERING I FILEN, OG DEN ER TAGET NED. Sætningen \"it can be assigned to safeguard people and properties, patrol parks and communities, guide a blind person, deliver packages to your front door, inspect factories or dangerous places, do rescue missions\" ligger på byte 23.014-23.500 - inde i HTML-kommentaren, en browser aldrig viser. Målt: alle fire positioneringstekster på E-siden ligger i kommentaren. Samme afgørelse som for tallene: vi udgiver ikke noget, producenten har trukket tilbage."
