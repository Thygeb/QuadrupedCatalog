noter:
  - "ZERO PUBLISHED SPECIFICATIONS. The visible part of the product page consists solely of navigation, header, and footer. The model names E300 and E400L are not visible on the page at all; they appear on the manufacturer's catalogue page alongside the subtitle Enterprise Version Available."
  - "THE SPECIFICATIONS EXIST IN THE FILE, BUT HAVE BEEN TAKEN DOWN. They sit inside an HTML COMMENT — byte 19,561 to 53,141, 33,580 bytes. Measured: the page body is 73,121 characters with the comment and 37,734 without it, i.e. 48% of the body is commented out. A complete specification sheet for both models is inside the comment."
  - "NONE OF IT HAS BEEN ENTERED AS DATA, AND NO ONE SHOULD. Checked: the page contains no innerHTML, no COMMENT_NODE, and no code that reinserts the block. A browser shows none of it. Pulling figures out of a withdrawn block would mean publishing, under the manufacturer's name, something the manufacturer has taken down."
  - "The distinction matters to a buyer: this is not a manufacturer that has never disclosed anything. It is a manufacturer that HAS disclosed it and then hidden it."
