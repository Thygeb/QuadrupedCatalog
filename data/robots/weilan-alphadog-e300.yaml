  note: "DER STAAR EN POSITIONERING I FILEN, OG DEN ER TAGET NED. Saetningen \"it can be assigned to safeguard people and properties, patrol parks and communities, guide a blind person, deliver packages to your front door, inspect factories or dangerous places, do rescue missions\" ligger paa byte 23.014-23.500 - inde i HTML-kommentaren, en browser aldrig viser. Maalt: alle fire positioneringstekster paa E-siden ligger i kommentaren. Samme afgoerelse som for tallene: vi udgiver ikke noget, producenten har trukket tilbage."
noter:
  - "NUL PUBLICEREDE SPECIFIKATIONER. Den synlige del af produktsiden bestaar udelukkende af navigation, sidehoved og sidefod. Modelnavnene E300 og E400L er ikke synlige paa siden overhovedet; de staar paa producentens katalogside sammen med underteksten Enterprise Version Available."
  - "SPECIFIKATIONERNE FINDES I FILEN, MEN ER TAGET NED. De ligger inde i en HTML-KOMMENTAR - byte 19.561 til 53.141, 33.580 bytes. Maalt: sidens krop er 73.121 tegn med kommentarer og 37.734 uden, altsaa 48 % af kroppen kommenteret ud. Inde i kommentaren ligger et komplet specifikationsark for begge modeller."
  - "INTET AF DET ER FOERT IND SOM DATA, OG DET BOER INGEN GOERE. Kontrolleret: siden indeholder ingen innerHTML, ingen COMMENT_NODE og ingen kode, der genindsaetter blokken. En browser viser intet af det. At hente tal ud af en tilbagetrukket blok ville vaere at udgive noget, producenten har taget ned, med producentens navn paa."
  - "Forskellen betyder noget for en indkoeber: det er ikke en producent, der aldrig har oplyst noget. Det er en producent, der HAR oplyst det og derefter skjult det."
  - "DESIGNSPOERGSMAALET, DENNE POST STILLER: hvordan ser en post ud, hvor samtlige felter er ikke_oplyst? Ser den oedelagt ud, har vi bygget forkert. Weilans INDUSTRImodeller - dem en driftschef ville overveje - har 0 % taethed, mens deres legetoejsmodel har 35 %."
