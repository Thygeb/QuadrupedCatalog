  note: "\"Research Platform\" er en etikette paa selve produktet, ved siden af \"Outdoor Walking\" og \"AI Gait\". L22: \"patrol\" og \"surveillance\" er omsat til sikkerhed_overvaagning; tredje citat er produktsidens egen modulbeskrivelse. Producentens brancheliste for hele firmaet naevner ogsaa Defense & Security og Logistics, men den er ikke skrevet om RBQ-10 og er ikke brugt."
